# FACTORY_WORKER integration (copy of the AgentOS config, platform scope)
# To check: responseFormat is masked (****) on read.
name: FACTORY_WORKER
integrationType: HTTP_API
description: "Submit a result for a Factory step attempt."
autoGrant: false
parameters:
  baseUrl: "{{FACTORY_URL}}"
  spec:
    url: "{{FACTORY_URL}}/api/factory/openapi/factory-worker.yaml"
    refreshMinutes: 60
    maxBytes: 5242880
  maxTools: 64
  maxResponseChars: 20000
  timeoutSeconds: 30
  maxConcurrentCalls: 4
  allowMutations: true
