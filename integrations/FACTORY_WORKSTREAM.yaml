# FACTORY_WORKSTREAM integration (copy of the AgentOS config, platform scope)
# To check: responseFormat and auth.apiKeyIn / auth.apiKeyName are masked (****) on read.
name: FACTORY_WORKSTREAM
integrationType: HTTP_API
description: "Inspect Factory workflows and start runs."
autoGrant: false
parameters:
  baseUrl: "{{FACTORY_URL}}"
  spec:
    url: "{{FACTORY_URL}}/api/factory/openapi/factory-workstream.yaml"
    refreshMinutes: 60
    maxBytes: 5242880
  maxTools: 64
  maxResponseChars: 20000
  timeoutSeconds: 30
  maxConcurrentCalls: 4
  allowMutations: true
  includeOperations:
    - list_workflows
    - get_workstream
    - get_workflow
    - get_step_attempts
    - get_blockers
    - get_required_human_actions
    - start_workflow