openapi: 3.0.3
info:
  title: Factory workstream HTTP API
  version: 0.1.0
  description: >-
    Conversational Factory facade for agents of the FACTORY_WORKSTREAM integration. The bearer is a
    Factory-issued JWT (optional when Factory runs in local security mode, FACTORY_SECURITY_MODE=local). Factory resolves the single AgentOS
    workstream from the explicit namespaceId within the authenticated organization. Every operation requires
    the namespaceId from the assignment. Only start_workflow initializes a missing mapping; reads and
    request_agent_retry are lookup-only and return WORKFLOW_NOT_FOUND when unmapped. Other identifiers are
    references resolved inside that boundary. Human validations are answered in Factory only.
servers:
  - url: https://factory.example.invalid
paths:
  /api/factory/workstream-service/workflows:
    parameters:
      - $ref: '#/components/parameters/NamespaceId'
    get:
      operationId: list_workflows
      summary: List the workflows of the configured workstream (read-only).
      parameters:
        - name: state
          in: query
          required: false
          schema:
            type: string
            enum: [active, removed]
        - name: workflowType
          in: query
          required: false
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Workflow summaries.
    post:
      operationId: start_workflow
      summary: Create a workflow run. Factory owns its identity and execution context.
      description: >-
        Resolves or initializes the namespace's workstream within the authenticated organization, then
        creates a Factory run. First launch needs no manually provisioned mapping; concurrent initializers
        converge on one active workstream. Existing identity, metadata, allowed workflow types and status
        are preserved; paused or archived mappings are refused. Request shape, field types, pin pairing/format
        and Idempotency-Key are validated before initialization. Definition selection and pin matching remain
        enforced when creating the run. Initialization and run creation are not atomic: an unknown
        registered workflow type or stale canonical hash can leave an active mapping but no run.
        The run is not attributed to an AgentOS case. Reuse the same
        Idempotency-Key and payload to retry safely; the same key with a different payload is refused.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 'Stable key chosen for this start request (letters, digits, . _ : @ -).'
          schema:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9][A-Za-z0-9._:@-]{0,127}$'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [workflowType]
              properties:
                workflowType:
                  type: string
                  maxLength: 128
                definitionVersion:
                  type: string
                  description: Immutable registered numeric x.y.z version with no leading zeroes except 0. Supply together with definitionHash; never silently select latest.
                  maxLength: 128
                  pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
                definitionHash:
                  type: string
                  description: Exact server-returned canonical SHA-256. Supply together with definitionVersion.
                  pattern: '^[a-f0-9]{64}$'
                title:
                  type: string
                  maxLength: 200
                ticket:
                  type: string
                  maxLength: 64
                  pattern: '^(#[1-9][0-9]{0,11}|[A-Za-z0-9][A-Za-z0-9._:/#-]{0,63})$'
                  description: Optional Jira ticket key (e.g. ABC-123) or GitHub issue reference (e.g. #123, 123, owner/repo#123).
      responses:
        '200': { description: Identical start replayed. }
        '201': { description: Run created, initializing an active namespace workstream if missing. }
        '400': { description: 'Invalid request or execution configuration. Controller-level namespace, field, pin-shape and key validation precedes initialization; later execution validation may leave an initialized mapping.' }
        '403': { description: 'The workstream namespace mapping is invalid or the workflow type is not allowed.' }
        '404': { description: 'Registered definition not found; initialization may have created a mapping, but no run.' }
        '409': { description: 'Idempotency, identity or definition conflict, including ambiguous definition selection. Definition failures may leave an initialized mapping but no run.' }
  /api/factory/workstream-service/parent-runs:
    parameters:
      - $ref: '#/components/parameters/NamespaceId'
    post:
      operationId: start_parent_run
      summary: Start a parent Run with its own AgentOS root Case and worktree.
      description: >-
        Use for workflows driven by a parent-Run selector. Repeating the same Idempotency-Key as
        the same caller replays that Run; another key creates another Run even for the same ticket
        and run type. The response may list other active Runs for the ticket within the caller's
        workstream. That list is an advisory warning and never prevents launch. Human gates are
        still answered in Factory.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Stable key for this launch request, distinct for independent runs.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [runType]
              properties:
                runType:
                  type: string
                  maxLength: 128
                title:
                  type: string
                  maxLength: 200
                ticket:
                  type: string
                  maxLength: 64
      responses:
        '201': { description: Parent Run created or replayed, with optional nonblocking concurrentRuns list. }
        '403': { description: Workstream boundary violation. }
        '409': { description: Request identity conflict. }
  /api/factory/workstream-service/workflows/{workflowId}:
    parameters:
      - $ref: '#/components/parameters/NamespaceId'
    get:
      operationId: get_workflow
      summary: Read the authoritative state of one workflow (read-only).
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '200': { description: 'Workflow state with steps, blockers, allowed actions and bounded attempts.' }
  /api/factory/workstream-service/workflows/{workflowId}/attempts:
    parameters:
      - $ref: '#/components/parameters/NamespaceId'
    get:
      operationId: get_step_attempts
      summary: List the durable attempts of a workflow, optionally of one step (read-only).
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
        - name: stepId
          in: query
          required: false
          schema: { type: string, maxLength: 128 }
      responses:
        '200': { description: 'Bounded, secret-free attempts.' }
  /api/factory/workstream-service/workflows/{workflowId}/blockers:
    parameters:
      - $ref: '#/components/parameters/NamespaceId'
    get:
      operationId: get_blockers
      summary: List the active blockers of a workflow (read-only).
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '200': { description: Blockers calculated by Factory. }
  /api/factory/workstream-service/workflows/{workflowId}/human-actions:
    parameters:
      - $ref: '#/components/parameters/NamespaceId'
    get:
      operationId: get_required_human_actions
      summary: List the pending human decisions of a workflow (read-only, information only).
      description: These decisions are answered in Factory. This integration can never answer them.
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      responses:
        '200': { description: Pending human actions. }
  /api/factory/workstream-service/workflows/{workflowId}/retries:
    parameters:
      - $ref: '#/components/parameters/NamespaceId'
    post:
      operationId: request_agent_retry
      summary: Request a governed retry of a blocked step.
      description: >-
        Only opens a retry request that a human approves in Factory. A repeated call for the same step
        returns the existing open request instead of opening another. Requires an existing namespace
        mapping; never initializes a missing workstream (WORKFLOW_NOT_FOUND).
      parameters:
        - name: workflowId
          in: path
          required: true
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [stepId, expectedRevision, reasonCode]
              properties:
                stepId: { type: string, maxLength: 128 }
                expectedRevision: { type: integer, minimum: 1 }
                reasonCode: { type: string, maxLength: 64 }
      responses:
        '200': { description: An open retry request already existed for this step. }
        '201': { description: Retry requested; awaiting human approval in Factory. }
        '409': { description: Stale revision or the step is not blocked. }
  /api/factory/workstream-service/workstreams/{workstreamId}:
    parameters:
      - $ref: '#/components/parameters/NamespaceId'
    get:
      operationId: get_workstream
      summary: Read the bounded aggregated projection of the configured workstream (read-only).
      parameters:
        - name: workstreamId
          in: path
          required: true
          description: Must match the workstream mapped to namespaceId within the authenticated organization.
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 50 }
      responses:
        '200': { description: Aggregated workstream projection. }
        '403': { description: The workstream is outside the caller's boundary. }
components:
  parameters:
    NamespaceId:
      name: namespaceId
      in: query
      required: true
      description: AgentOS namespace UUID from the assignment. Resolved inside the authenticated organization; only start_workflow initializes a missing mapping. Reads and retry require an existing mapping.
      schema:
        type: string
        format: uuid
