      responses:
        "200":
          description: The capability is valid and the binding is resolved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FactoryStepResultBindingEnvelopeFactoryStepResultBindingData"
        "401":
          description: RESULT_CAPABILITY_INVALID or TRUST_CONTEXT_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: RESULT_IDENTITY_MISMATCH
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
