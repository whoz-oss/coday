      summary: Ask a durable human step question and park the attempt in waiting_human.
      description: "Requires an `Authorization: Bearer <capability>` token issued\
        \ by the Factory. Returns as soon as the question is durably recorded — the\
        \ answer never blocks the worker call."
      operationId: askAgentStepQuestion
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: X-AgentOS-Case-Id
        in: header
        required: false
        schema:
          type: string
      - name: X-AgentOS-Agent-Name
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentStepQuestionRequest"
      responses:
        "202":
          description: Question durably recorded (or idempotent replay)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStepQuestionEnvelopeAgentStepQuestionData"
        "400":
          description: "QUESTION_SCHEMA_INVALID, RESULT_IDENTITY_MISMATCH or INVALID_RESULT_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: RESULT_CAPABILITY_INVALID or TRUST_CONTEXT_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: QUESTION_ATTEMPT_NOT_WAITABLE or QUESTION_ALREADY_ASKED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: RESULT_CAPABILITY_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
