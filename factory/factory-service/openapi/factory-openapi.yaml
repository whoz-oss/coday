  /api/factory/agent-step-results:
    post:
      tags:
      - agent-step-results
      summary: Submit a capability-bound agent step result.
      description: "Requires an `Authorization: Bearer <capability>` token issued\
        \ by the Factory."
      operationId: submitAgentStepResult
      parameters:
      - name: Authorization
        in: header
        required: false
        schema:
          type: string
      - name: X-AgentOS-Case-Id
        in: header
        required: false
        schema:
          type: string
      - name: X-AgentOS-Agent-Name
        in: header
        required: false
        schema:
          type: string
      - name: X-Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentStepResultRequest"
      responses:
        "201":
          description: Result created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStepResultEnvelopeAgentStepResultData"
        "200":
          description: Idempotent replay of an identical submission
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentStepResultEnvelopeAgentStepResultData"
        "400":
          description: "RESULT_SCHEMA_INVALID, RESULT_IDENTITY_MISMATCH or INVALID_RESULT_REQUEST"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: RESULT_CAPABILITY_INVALID or TRUST_CONTEXT_UNAVAILABLE
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: "RESULT_SEMANTIC_COLLISION, IDEMPOTENCY_KEY_COLLISION or STALE_AMENDMENT_SEQUENCE"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "410":
          description: RESULT_CAPABILITY_EXPIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/factory/agent-step-results/capability/refresh:
