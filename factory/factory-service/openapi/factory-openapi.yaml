openapi: 3.1.0
info:
  title: Factory Service API
  description: REST API for the Factory Service — autonomous Kotlin/Spring Boot backend
  version: 0.0.1
servers:
- url: http://localhost:18141
  description: Generated server url
tags:
- name: work-environments
  description: Work-unit environment provisioning control plane
- name: workflows
  description: "Workflow projections, transitions and interactions"
- name: agentos-proxy
  description: AgentOS relay endpoints
- name: step-result-bindings
  description: Verify a capability-bound agent step result submission
- name: delivery
  description: Governed delivery control plane
- name: agent-step-results
  description: Capability-bound agent step result submission
- name: delivery-operations
  description: "Delivery deployment, verification and rollback control plane"
- name: plan-change-proposals
  description: Governed replanning plan-change proposals
- name: workflows
  description: Workflow definitions
- name: workstreams
  description: Factory workstreams
- name: oracles
  description: Oracle definitions and execution runs
- name: agent-step-questions
  description: Capability-bound worker step questions (ask-step-question)
paths:
  /api/factory/workstreams/{workstreamId}:
    get:
      tags:
      - workstreams
      summary: Read one workstream registry entry of the caller's trusted workstream.
      operationId: getWorkstream
      parameters:
      - name: workstreamId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
    put:
      tags:
      - workstreams
      summary: Save a new revision of a workstream registry entry.
      operationId: updateWorkstream
      parameters:
      - name: workstreamId
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateWorkstreamRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/factory/workflows/{workflowId}/projection:
    get:
      tags:
      - workflows
      summary: Read the current workflow projection.
      operationId: projectionWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeMapStringObject"
    put:
      tags:
      - workflows
      summary: Publish a declarative workflow projection.
      operationId: publishProjectionWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
  /api/factory/workstreams:
    get:
      tags:
      - workstreams
      summary: List workstreams for the caller's tenant.
      operationId: listWorkstream
      parameters:
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
    post:
      tags:
      - workstreams
      summary: Create a workstream entry.
      operationId: createWorkstream
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateWorkstreamRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/factory/workstreams/{workstreamId}/controller-case:
    get:
      tags:
      - workstreams
      summary: Read the active controller case of the caller's trusted workstream.
      operationId: activeControllerCaseWorkstream
      parameters:
      - name: workstreamId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ControllerCaseResponse"
    post:
      tags:
      - workstreams
      summary: Start the first controller case of the caller's trusted workstream.
      operationId: startControllerCaseWorkstream
      parameters:
      - name: workstreamId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartControllerCaseRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ControllerCaseResponse"
  /api/factory/workstreams/{workstreamId}/controller-case/compact:
    post:
      tags:
      - workstreams
      summary: Compact / renew the controller case of the caller's trusted workstream.
      operationId: compactControllerCaseWorkstream
      parameters:
      - name: workstreamId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompactControllerCaseRequest"
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ControllerCaseResponse"
  /api/factory/workflows:
    get:
      tags:
      - workflows
      summary: List workflow projections of the caller's tenant scope (optionally
        filtered by namespace).
      operationId: listWorkflow
      parameters:
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      - name: workflowType
        in: query
        required: false
        schema:
          type: string
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeMapStringObject"
    post:
      tags:
      - workflows
      summary: Create and durably submit a workflow run. Factory assigns identity
        and execution context.
      operationId: createRunWorkflow
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/transitions:
    post:
      tags:
      - workflows
      summary: Apply a revision-safe workflow transition.
      operationId: transitionWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/steps/{stepId}/oracles/{oracleId}/runs:
    post:
      tags:
      - oracles
      summary: Run an oracle against a workflow step
      description: Starts (or idempotently replays) one oracle execution for the given
        step.
      operationId: runOracle
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: stepId
        in: path
        required: true
        schema:
          type: string
      - name: oracleId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OracleRunRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOracleRunResponse"
  /api/factory/workflows/{workflowId}/start:
    post:
      tags:
      - workflows
      summary: Start a governed workflow instance from a definition.
      operationId: startWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
      deprecated: true
  /api/factory/workflows/{workflowId}/run:
    post:
      tags:
      - workflows
      summary: Run the frontend-controlled workflow.
      operationId: runWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: sync
        in: query
        required: false
        schema:
          type: boolean
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/retries:
    get:
      tags:
      - workflows
      summary: Read workflow retry aggregates.
      operationId: retriesMetricsWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeMapStringObject"
    post:
      tags:
      - workflows
      summary: Open a retry for a blocked step.
      operationId: retriesWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/restore:
    post:
      tags:
      - workflows
      summary: Restore a removed workflow projection.
      operationId: restoreWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeMapStringObject"
  /api/factory/workflows/{workflowId}/purge:
    post:
      tags:
      - workflows
      summary: Purge a removed workflow projection.
      operationId: purgePostWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeMapStringObject"
    delete:
      tags:
      - workflows
      summary: Purge a removed workflow projection (DELETE form).
      operationId: purgeDeleteWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeMapStringObject"
  /api/factory/workflows/{workflowId}/interactions:
    get:
      tags:
      - workflows
      summary: List human interactions for a workflow.
      operationId: listInteractionsWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
    post:
      tags:
      - workflows
      summary: Open a human interaction at an exact workflow revision.
      operationId: openInteractionWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/interactions/{interactionId}/reply:
    post:
      tags:
      - workflows
      summary: Reply to a human interaction atomically.
      operationId: replyInteractionWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: interactionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/evidence:
    get:
      tags:
      - workflows
      summary: List workflow evidence.
      operationId: listEvidenceWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      - name: stepId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
    post:
      tags:
      - workflows
      summary: Append an audited workflow evidence fact.
      operationId: appendEvidenceWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/environment/release:
    post:
      tags:
      - work-environments
      summary: Release (decommission) the workflow environment
      operationId: releaseWorkUnitEnvironment
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseEnvironmentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentDataEnvelopeEnvironmentResponse"
  /api/factory/workflows/{workflowId}/environment/reconcile:
    post:
      tags:
      - work-environments
      summary: Reconcile the workflow environment against its Git worktree
      operationId: reconcileWorkUnitEnvironment
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentDataEnvelopeEnvironmentResponse"
  /api/factory/workflows/{workflowId}/environment/provision:
    post:
      tags:
      - work-environments
      summary: Provision (or idempotently reuse) the workflow environment
      operationId: provisionWorkUnitEnvironment
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionEnvironmentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentDataEnvelopeEnvironmentResponse"
  /api/factory/workflows/{workflowId}/delivery/verify:
    post:
      tags:
      - delivery-operations
      summary: Create and execute a production-verification operation
      operationId: verifyDeliveryOperation
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/rollbacks:
    post:
      tags:
      - delivery-operations
      summary: Create a rollback request bound to a trusted target
      operationId: requestRollbackDeliveryOperation
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/rollbacks/{rollbackRequestId}/verify:
    post:
      tags:
      - delivery-operations
      summary: Create and execute a rollback-verification operation
      operationId: verifyRollbackDeliveryOperation
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: rollbackRequestId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/rollbacks/{rollbackRequestId}/execute:
    post:
      tags:
      - delivery-operations
      summary: Create and execute a rollback operation
      operationId: executeRollbackDeliveryOperation
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: rollbackRequestId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/rollbacks/{rollbackRequestId}/approve:
    post:
      tags:
      - delivery-operations
      summary: Approve a pending rollback request
      operationId: approveRollbackDeliveryOperation
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: rollbackRequestId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/push:
    post:
      tags:
      - delivery
      summary: Push the delivery branch to the configured remote
      operationId: pushDelivery
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/pull-request:
    post:
      tags:
      - delivery
      summary: Create a draft pull request for the delivery
      operationId: pullRequestDelivery
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/promote:
    post:
      tags:
      - delivery
      summary: "Evaluate and apply an ordered, evidence-gated promotion"
      operationId: promoteDelivery
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/evidence:
    post:
      tags:
      - delivery
      summary: Record a Factory delivery evidence fact
      operationId: recordEvidenceDelivery
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/deployment/reconcile:
    post:
      tags:
      - delivery-operations
      summary: Reconcile a running or indeterminate delivery operation
      operationId: reconcileDeliveryOperation
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/deploy:
    post:
      tags:
      - delivery-operations
      summary: Create and execute a deployment operation
      operationId: deployDeliveryOperation
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/checkpoint:
    post:
      tags:
      - delivery
      summary: Create a git checkpoint commit for the delivery
      operationId: checkpointDelivery
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/cost/stop:
    post:
      tags:
      - workflows
      summary: Relay a run-cost stop to AgentOS for the workflow's cases.
      operationId: stopCostWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeMapStringObject"
  /api/factory/workflows/{workflowId}/cost/continue:
    post:
      tags:
      - workflows
