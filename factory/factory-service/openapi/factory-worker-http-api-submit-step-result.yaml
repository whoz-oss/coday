openapi: 3.0.3
info:
  title: Factory worker result submission
  version: 0.1.0
servers:
  - url: https://factory.example.invalid
paths:
  /api/factory/agent-step-results:
    post:
      operationId: submitStepResult
      summary: Submit the structured result of one Factory attempt
      description: >-
        Submit only after completing the current Factory step. Use the Factory-issued
        attemptId and Idempotency-Key from the execution brief. Neither value is a secret.
        The bearer is a Factory-issued JWT (optional when Factory runs in local security mode, FACTORY_SECURITY_MODE=local).
        The workflow, step and namespace are resolved by Factory from the attempt.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Factory-issued submission identifier from the execution brief.
          schema:
            type: string
            minLength: 1
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [attemptId, result]
              properties:
                attemptId:
                  type: string
                  minLength: 1
                  description: Factory-issued public attempt identifier from the execution brief.
                result:
                  type: object
                  additionalProperties: false
                  required: [status, summary, claims]
                  properties:
                    status:
                      type: string
                      enum: [PASS, FAIL, NEEDS_RESEARCH]
                    selectedRoutes:
                      type: array
                      minItems: 1
                      maxItems: 16
                      uniqueItems: true
                      description: Required only for PASS of a decision step; omit on ordinary steps, FAIL and NEEDS_RESEARCH. Named routes from the definition, not target IDs. single requires exactly one; multiple allows one or more. Unknown, missing, duplicate and out-of-mode choices are rejected. Activation occurs only after configured validators succeed.
                      items: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$' }
                    summary:
                      type: string
                      minLength: 1
                      maxLength: 2000
                    claims:
                      type: object
                      additionalProperties: false
                      required: [modifiedFiles]
                      properties:
                        modifiedFiles:
                          type: array
                          maxItems: 1000
                          items: { type: string, minLength: 1, maxLength: 1024 }
                        deliveryAnalysis:
                          type: object
                          additionalProperties: false
                          required: [changeType, ticket, title]
                          properties:
                            changeType: { type: string, enum: [feature, bugfix] }
                            ticket:
                              type: string
                              pattern: '^((#|[A-Za-z0-9][A-Za-z0-9._-]{0,38}/[A-Za-z0-9._-]{1,48}#)?[1-9][0-9]{0,11}|[A-Z][A-Z0-9]{1,15}-[1-9][0-9]{0,11})$'
                              description: GitHub issue reference such as #123, 123, owner/repo#123, or Jira-style key such as ABC-123.
                            title: { type: string, minLength: 1, maxLength: 200 }
                            baseBranch: { type: string, minLength: 1, maxLength: 255 }
                    artifacts:
                      type: array
                      maxItems: 8
                      items:
                        type: object
                        additionalProperties: false
                        required: [kind, encoding, content]
                        properties:
                          kind: { type: string, minLength: 1, maxLength: 128 }
                          encoding: { type: string, enum: [markdown] }
                          content: { type: string, minLength: 1, maxLength: 262144 }
                    findings:
                      type: array
                      maxItems: 100
                      items:
                        type: object
                        additionalProperties: false
                        required: [severity, code, summary]
                        properties:
                          severity: { type: string, enum: [info, warning, error, blocking] }
                          code: { type: string, minLength: 1, maxLength: 128 }
                          summary: { type: string, minLength: 1, maxLength: 1000 }
                          file: { type: string, minLength: 1, maxLength: 1024 }
                          line: { type: integer, minimum: 1 }
                    expected_amendment_seq:
                      type: integer
                      format: int64
                      minimum: 0
                    continuation:
                      type: object
                      additionalProperties: false
                      required: [steps]
                      description: >-
                        Only for PASS of a step whose definition declares `expansion` (the brief says so). Steps appended to THIS run only; the definition catalog never changes.
                        Each step uses the canonical workflow step (id, name, responsibility, dependsOn, optional entry/mission/exit together, optional decision/join).
                        An empty dependsOn means after the expanding step; dependsOn may name only the expanding step or other continuation steps.
                        Step ids must not exist in the run, agent steps must name an agent enabled in the namespace, `code` steps are not supported, and `expansion` / `outcomeTransitions` are not allowed in a continuation.
                        If Factory cannot read the agents of the namespace, it answers AGENTS_UNVERIFIABLE; send the result again.
                        A rejected continuation answers 400 RESULT_SCHEMA_INVALID with details.violations[] ({path, code, message}); the capability is not used up, so fix the listed paths and send the result again.
                      properties:
                        steps:
                          type: array
                          minItems: 1
                          maxItems: 50
                          items:
                            type: object
                            required: [id, name, responsibility, dependsOn]
                            properties:
                              id: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$' }
                              name: { type: string, minLength: 1, maxLength: 256 }
                              responsibility:
                                type: object
                                required: [kind, name]
                                properties:
                                  kind: { type: string, enum: [agent, human, code] }
                                  name: { type: string, minLength: 1, maxLength: 256 }
                              dependsOn:
                                type: array
                                items: { type: string, pattern: '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$' }
                              entry: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 4000 } }
                              mission: { type: string, minLength: 1, maxLength: 16000 }
                              exit: { type: array, maxItems: 50, items: { type: string, minLength: 1, maxLength: 4000 } }
                              decision: { type: object }
                              join: { type: string }
      responses:
        '200':
          description: Identical idempotent replay accepted
        '201':
          description: Result accepted
        '400':
          description: Invalid schema or inconsistent attempt data; a bad continuation lists details.violations[] and does not use the capability up
        '401':
          description: Missing or invalid credential in auth security mode (never returned in local mode)
        '404':
          description: No such attempt
        '409':
          description: Idempotency or semantic collision
