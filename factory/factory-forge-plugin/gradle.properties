# Gradle Properties — Factory Forge Plugin
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Kotlin
kotlin.code.style=official
kotlin.incremental=true
# Never bundle the Kotlin stdlib: the plugin is loaded into the host JVM which
# already provides it (see the APD class-loading strategy in factory-service).
kotlin.stdlib.default.dependency=false

# PF4J annotation-processor storage
pf4j.storageClassName=org.pf4j.processor.LegacyExtensionStorage
