openapi: 3.1.0
info:
  title: Factory Forge Plugin API
  description: >-
    REST API contributed by the optional `factory-forge-plugin` (PF4J) — the
    Jira ticket relay. These routes are mounted dynamically by factory-service
    when the plugin JAR is present in the host `plugins/` directory; without the
    plugin they return `404`.
  version: 0.0.2
servers:
  - url: http://localhost:8141
    description: Factory Service host
tags:
  - name: jira
    description: Jira ticket relay
paths:
  /api/jira/{ticketId}:
    get:
      tags: [jira]
      summary: Fetch a Jira ticket as Markdown.
      operationId: getJiraTicket
      parameters:
        - $ref: "#/components/parameters/ticketId"
      responses:
        "200":
          description: The relayed ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapStringObject"
        "501":
          description: Jira credentials are not configured.
  /api/factory/jira/{ticketId}:
    get:
      tags: [jira]
      summary: Fetch a Jira ticket as Markdown (alias).
      operationId: getJiraTicketAlias
      parameters:
        - $ref: "#/components/parameters/ticketId"
      responses:
        "200":
          description: The relayed ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MapStringObject"
        "501":
          description: Jira credentials are not configured.
components:
  parameters:
    ticketId:
      name: ticketId
      in: path
      required: true
      schema:
        type: string
  schemas:
    MapStringObject:
      type: object
      additionalProperties: true
