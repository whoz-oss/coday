name: Validate Coday on pull requests

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    branches:
      - master
      - 'hotfix/*'
      - 'workstream/**'

env:
  NX_MAX_WORKERS: 4

defaults:
  run:
    shell: bash

jobs:
  validate-ts:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and test TypeScript projects
        run: npx nx affected --base=origin/${GITHUB_BASE_REF} --head=HEAD --target="lint,test" --exclude="tag:platform:jvm-agentos,tag:platform:jvm-factory" --parallel=$NX_MAX_WORKERS --verbose

  validate-jvm:
    runs-on: ubuntu-latest
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          filter: tree:0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # nx affected cannot be used directly with --projects="tag:platform:jvm-*" because the tag filter
      # gets forwarded to the underlying Gradle/Jest commands as an unknown flag, causing build failures.
      # Instead, we resolve the affected JVM project names first via nx show projects (merging both
      # platform tags), then pass the explicit names to nx run-many (which does not forward them to
      # executors).
      - name: Build and test JVM projects
        run: |
          AFFECTED_AGENTOS=$(npx nx show projects --affected --base=origin/${GITHUB_BASE_REF} --head=HEAD --projects="tag:platform:jvm-agentos" --json --quiet | jq -r '.[]' || true)
          AFFECTED_FACTORY=$(npx nx show projects --affected --base=origin/${GITHUB_BASE_REF} --head=HEAD --projects="tag:platform:jvm-factory" --json --quiet | jq -r '.[]' || true)
          AFFECTED_JVM=$(echo "$AFFECTED_AGENTOS $AFFECTED_FACTORY" | tr ' ' '\n' | sed '/^$/d' | sort -u | paste -sd ',' -)
          if [ -n "$AFFECTED_JVM" ]; then
            npx nx run-many --targets=test --projects="$AFFECTED_JVM" --parallel=$NX_MAX_WORKERS --verbose
          else
            echo "No affected JVM projects"
          fi

      - name: Check OpenAPI spec is up to date
        run: npx nx affected --base=origin/${GITHUB_BASE_REF} --head=HEAD --target="check-openapi-spec" --verbose

  merge-gate:
    runs-on: ubuntu-latest
    needs: [validate-ts, validate-jvm]
    if: ${{ always() && !github.event.pull_request.draft }}
    steps:
      - name: Check all jobs passed
        run: |
          results='${{ toJson(needs.*.result) }}'
          echo "Job results: $results"
          if echo "$results" | grep -qE '"failure"|"cancelled"'; then
            echo "One or more validation jobs failed or were cancelled"
            exit 1
          fi
          echo "All validation jobs passed or were skipped"

  # ---------------------------------------------------------------------------
  # automerge-to-target: runs after validation on work/* -> workstream/* PRs.
  #
  # Replaces the former promote-to-integration job: validated PRs are now merged
  # directly into their target workstream branch (no integration/<slug> branch).
  #
  # Rules enforced here:
  #   1. The merge MUST be done with RELEASE_PAT. A merge performed with
  #      GITHUB_TOKEN does not trigger downstream workflows (push on the
  #      workstream branch), so they would silently never run.
  #   2. Auto-merge is requested (--auto): GitHub merges as soon as every
  #      branch-protection requirement (required checks, reviews) is satisfied.
  #      If the PR is already mergeable, it is merged immediately.
  #   3. --match-head-commit pins the merge to the validated SHA: a push made
  #      after validation can never be merged unvalidated.
  #   4. Failure to merge is signal: comment on the PR and fail loudly.
  # ---------------------------------------------------------------------------
  automerge-to-target:
    runs-on: ubuntu-latest
    needs: [validate-ts, validate-jvm, merge-gate]
    # Conditions for this job to run:
    #   - validation must have passed (no failure/cancel in any needed job)
    #   - the PR must not carry the 'skip-automerge' label (opt-out: validation still runs,
    #     but the PR is left for a manual merge). The label is also re-checked live in the
    #     first step, since the event payload is a snapshot taken when the run started.
    #   - the PR target must be a workstream branch
    #   - the PR must come from the same repository (not a fork)
    #
    # Fork PRs have no access to RELEASE_PAT or repository write permissions.
    # The job is SKIPPED (not failed) for fork PRs.
    # We deliberately do NOT use pull_request_target, which would run
    # fork-authored code with full secret access -- a serious security risk.
    if: |
      always() &&
      !github.event.pull_request.draft &&
      !contains(github.event.pull_request.labels.*.name, 'skip-automerge') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      startsWith(github.base_ref, 'workstream/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    # Serialise merges into a given workstream branch. github.base_ref is the full
    # branch name (e.g. "workstream/<slug>/master") and is unique per workstream.
    # cancel-in-progress: false so a merge in flight is never interrupted.
    concurrency:
      group: workstream-${{ github.base_ref }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PAT }}
      GH_REPO: ${{ github.repository }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_REF: ${{ github.base_ref }}
      HEAD_REF: ${{ github.head_ref }}
    steps:
      # Opt-out check on the LIVE labels. The job-level `if` only sees the labels as they
      # were when the run started; a label added during the (long) validation would be
      # missed. If the label is present, stop here and merge nothing.
      - name: Check skip-automerge label
        id: optout
        run: |
          LABELS=$(gh pr view "$PR_NUMBER" --json labels --jq '.labels[].name')
          if echo "$LABELS" | grep -qx 'skip-automerge'; then
            echo "::notice::PR #${PR_NUMBER} has the 'skip-automerge' label: not merging automatically."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # Cross-check the slug of head_ref against the slug of base_ref.
      # A mismatch means a work/foo/* PR is targeting workstream/bar/* -- user error,
      # do not merge it automatically.
      - name: Validate workstream slug
        if: steps.optout.outputs.skip != 'true'
        run: |
          SLUG=$(echo "$BASE_REF" | cut -d'/' -f2)
          HEAD_SLUG=$(echo "$HEAD_REF" | cut -d'/' -f2)

          if [ "$HEAD_SLUG" != "$SLUG" ]; then
            MSG="Slug mismatch: head branch '${HEAD_REF}' slug '${HEAD_SLUG}' does not"
            MSG="${MSG} match target branch '${BASE_REF}' slug '${SLUG}'."
            MSG="${MSG} This PR is targeting the wrong workstream branch."
            gh pr comment "$PR_NUMBER" \
              --body "Automerge skipped -- workstream slug mismatch. ${MSG}"
            echo "::error::${MSG}"
            exit 1
          fi

      # Enable auto-merge on the PR, pinned to the validated head SHA.
      # If auto-merge cannot be enabled (e.g. the PR is already in a clean state, or
      # auto-merge is disabled on the repository), fall back to an immediate merge.
      - name: Merge PR into target branch
        if: steps.optout.outputs.skip != 'true'
        run: |
          echo "Merging PR #${PR_NUMBER} (${HEAD_REF} @ ${PR_HEAD_SHA}) into ${BASE_REF}..."

          if gh pr merge "$PR_NUMBER" --auto --merge --match-head-commit "$PR_HEAD_SHA"; then
            echo "::notice::Auto-merge enabled (or PR merged) for #${PR_NUMBER} into ${BASE_REF}."
          elif gh pr merge "$PR_NUMBER" --merge --match-head-commit "$PR_HEAD_SHA"; then
            echo "::notice::PR #${PR_NUMBER} merged into ${BASE_REF}."
          else
            BODY="Automerge failed. The PR passed validation but could not be merged into ${BASE_REF}."
            BODY="${BODY} Likely causes: merge conflict with the target branch, unmet branch-protection requirements,"
            BODY="${BODY} or the head moved since validation. Rebase or merge ${BASE_REF} into this branch and push again."
            gh pr comment "$PR_NUMBER" --body "$BODY"
            echo "::error::Automerge failed. See PR comment."
            exit 1
          fi
