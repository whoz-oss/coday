# Workstream Build -- publishes a coherent prerelease artifact set on every push to integration/**.
#
# Triggered by:
#   - promote-to-integration (validate.yml) pushing a merged work branch
#   - integration-reset.yml force-resetting the branch after a workstream merge
#
# Three inviolable rules this workflow enforces:
#   1. NEVER create a release/* tag. Doing so corrupts the next real release's
#      version derivation (nx release walks conventional commits from the last tag).
#      Workstream tags live in a FLAT, dash-only namespace:
#        workstream-<slug>-<n>   e.g. workstream-forge-4
#      No slashes: a hierarchical tag (refs/tags/workstream/<slug>/...) shadows the
#      branch taxonomy (refs/heads/workstream/<slug>/master), inviting rev-parse
#      ambiguity, and is awkward to glob or pass to `gh release download`.
#      <n> is a PER-WORKSTREAM counter derived by reading this slug's existing tags
#      and incrementing -- see the "Compute version" and "Reserve workstream tag" steps.
#      This workflow no longer READS release/* either: the version base is a fixed 0.0.0.
#
# The 'workstream' keyword appears in all three published identifiers, by design:
#      version   0.0.0-workstream-<slug>.<n>
#      git tag   workstream-<slug>-<n>
#      dist-tag  workstream-<slug>
#  so an artifact is self-identifying as a workstream build from any one of them alone.
#   2. NEVER run releaseChangelog. It commits/tags/pushes -- all wrong here.
#      Version stamps live only in the working tree and are never committed.
#   3. NEVER publish to the 'latest' npm dist-tag. npm publishes use
#      --tag workstream-<slug>. Publishing to 'latest' would reach every consumer.
#
# Desktop apps (desktop/desktop-twin) are NOT built here -- they have no-op
# nx-release-publish targets and are excluded from workstream builds.
#
name: Workstream Build

on:
  push:
    branches:
      - 'integration/**'

# Serialise builds per workstream slug.
# cancel-in-progress: false is mandatory -- cancelling mid-publish can leave a
# partial artifact set that appears coherent but is missing packages.
#
# group resolves to e.g. "workstream-integration/talent-portal".
# github.ref_name for an integration push is "integration/<slug>", unique per
# workstream, so builds for the SAME integration branch serialise correctly.
#
# THIS GROUP IS NOW LOAD-BEARING FOR CORRECTNESS, not just artifact coherence.
# The "Compute version" step performs a read-modify-write on the per-slug tag counter
# (read refs/tags/workstream-<slug>-*, increment, push). Two concurrent builds on the
# same integration branch would read the same <n>, and the second tag push would be
# rejected as already-existing. Serialising same-slug builds is what makes the
# read-modify-write atomic in practice. Do not weaken this group or set
# cancel-in-progress: true.
#
# Builds for DIFFERENT slugs may safely run concurrently -- they touch disjoint tag
# namespaces, which is precisely the property a per-slug counter has and
# GITHUB_RUN_NUMBER did not.
#
# KNOWN LIMITATION -- this group does NOT match validate.yml or
# integration-reset.yml (both key on github.base_ref = "workstream/<slug>/master").
# GitHub Actions expressions have no split/substring function (the available set is
# contains, startsWith, endsWith, format, join, toJSON, fromJSON, hashFiles plus the
# status checks), and `concurrency` is evaluated before any step runs, so a slug
# buried mid-ref CANNOT be extracted for use as a shared key. A build is therefore
# NOT serialised against a concurrent promote or reset.
#
# In practice this is tolerable: a promote/reset push simply triggers another build,
# and this group ensures those builds queue rather than overlap. If true
# cross-workflow serialisation is ever required, the options are (a) flatten the
# taxonomy so the slug is the whole ref segment, or (b) route through workflow_call
# passing the slug as an input, making inputs.slug usable in concurrency.group.
concurrency:
  group: workstream-${{ github.ref_name }}
  cancel-in-progress: false

env:
  NPM_CONFIG_PROVENANCE: true
  NX_MAX_WORKERS: 4

defaults:
  run:
    shell: bash

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Job 1: Version, stamp, npm publish.
  #
  # Outputs consumed by all downstream jobs:
  #   version  -- 0.0.0-workstream-<slug>.<n>
  #   tag      -- workstream-<slug>-<n>
  #   slug     -- <slug>
  # ─────────────────────────────────────────────────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push the reservation tag
      id-token: write   # npm OIDC trusted publishing
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag:     ${{ steps.version.outputs.tag }}
      slug:    ${{ steps.slug.outputs.slug }}
    steps:
      # fetch-depth: 0 is MANDATORY -- and the reason is now SILENT failure, not loud.
      # Version computation reads refs/tags/workstream-<slug>-* to derive the counter.
      # (It no longer reads refs/tags/release/* at all: the base is a fixed 0.0.0.)
      # A shallow clone yields an empty tag list, so the counter would silently reset to
      # 1 and collide with an already-published npm version -- the tag push would be
      # rejected, or worse the publish would fail on an immutable version. There is no
      # loud guard for this case because an empty tag list is indistinguishable from a
      # genuinely new workstream.
      #
      # token: RELEASE_PAT so the reservation tag push below is authenticated.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PAT }}

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # registry-url is required for npm OIDC trusted publishing.
      # npm auth uses OIDC (id-token: write above), matching release.yml exactly.
      # No static NPM_TOKEN / NODE_AUTH_TOKEN secret is required or used.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://${{ vars.NPM_REGISTRY }}'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # github.ref_name is the short branch name, e.g. "integration/talent-portal".
      # Strip the "integration/" prefix to get the slug.
      - name: Derive slug
        id: slug
        run: |
          REF_NAME="${{ github.ref_name }}"
          SLUG="${REF_NAME#integration/}"
          echo "slug=${SLUG}" >> $GITHUB_OUTPUT
          echo "Workstream slug: ${SLUG}"

      # Produces TWO identifiers, consistent with each other and with the npm dist-tag:
      #   version  = 0.0.0-workstream-<slug>.<n>   e.g. 0.0.0-workstream-forge.4
      #   tag      = workstream-<slug>-<n>          e.g. workstream-forge-4
      #   dist-tag = workstream-<slug>              e.g. workstream-forge
      #
      # WHY THE BASE IS A FIXED 0.0.0 -- and why it is NOT derived from release/*:
      # Workstream artifacts are deliberately DECOUPLED from the repo's release line.
      # 0.0.0 is a deliberate null: it states "no release lineage is claimed", and it
      # sorts below every real release, so a workstream prerelease can never be resolved
      # ahead of a genuine version by any semver range.
      #
      # <n> is a PER-WORKSTREAM counter read from this slug's existing tags and incremented
      # -- NOT GITHUB_RUN_NUMBER. run_number is scoped to the workflow FILE, so with two
      # live workstreams the sequences interleave (forge.1, talent.2, forge.3, talent.4).
      # A per-slug counter gives each workstream a clean 1,2,3,...
      #
      # PIPE SAFETY: sed, sort and tail each consume their ENTIRE input before emitting,
      # so none of them closes the pipe early. This is NOT the `| head -1` hazard that
      # killed an earlier version of this step with SIGPIPE/exit 141.
      - name: Compute version
        id: version
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"

          LAST_N=$(git for-each-ref --format='%(refname:strip=2)' "refs/tags/workstream-${SLUG}-*" \
                     | sed -n "s/^workstream-${SLUG}-\([0-9][0-9]*\)$/\1/p" \
                     | sort -n \
                     | tail -1)

          if [ -z "$LAST_N" ]; then
            N=1
            echo "No existing workstream-${SLUG}-<n> tag found; starting counter at 1."
          else
            N=$((LAST_N + 1))
            echo "Latest workstream counter for '${SLUG}': ${LAST_N} -> ${N}"
          fi

          VERSION="0.0.0-workstream-${SLUG}.${N}"
          TAG="workstream-${SLUG}-${N}"

          echo "Computed version: ${VERSION}"
          echo "Computed tag:     ${TAG}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      # Reserve the counter by pushing the tag BEFORE anything is published.
      # Pushing first makes the tag a RESERVATION: the counter is consumed the moment it is
      # computed. A failed build then leaves a dangling tag with no release, which is cheap,
      # self-evident, and strictly better than a poisoned counter.
      #
      # A lightweight tag needs no committer identity, so no git config is required.
      # Tag pushes do not match `on: push: branches:`, so this triggers no workflow.
      - name: Reserve workstream tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${{ github.sha }}"
          git tag "$TAG" "$SHA"
          git push origin "refs/tags/${TAG}"
          echo "::notice::Reserved tag ${TAG} at ${SHA}."

      # workstream-release.ts stamps ALL package.json files and
      # agentos/gradle/libs.versions.toml with the exact version, then publishes
      # npm packages with dist-tag workstream-<slug>.
      #
      # It performs NO git operations -- version stamps live only in the working tree.
      # (Rule 2: never commit version bumps on an integration branch.)
      # (Rule 3: npm packages are published with --tag workstream-<slug>, never latest.)
      - name: Stamp versions and publish npm packages
        run: |
          npx tsx scripts/workstream-release.ts \
            --version "${{ steps.version.outputs.version }}" \
            --slug "${{ steps.slug.outputs.slug }}"
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT }}

      - name: Write job summary
        if: always()
        run: |
          echo "## Workstream Prerelease: ${{ steps.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Workstream | ${{ steps.slug.outputs.slug }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${{ steps.version.outputs.version }} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm dist-tag | workstream-${{ steps.slug.outputs.slug }} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub tag | ${{ steps.version.outputs.tag }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 2: Resolve the list of JVM projects to publish from the platform:jvm tag.
  #
  # Mirrors compute-jvm-projects in release.yml exactly -- a dedicated lightweight
  # job (no JDK, no Gradle) whose sole output feeds the matrix in publish-jvm.
  # Runs in parallel with build-jars after prepare completes.
  # ─────────────────────────────────────────────────────────────────────────────
  compute-jvm-projects:
    runs-on: ubuntu-latest
    needs: prepare
    outputs:
      projects: ${{ steps.resolve.outputs.projects }}
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve JVM projects from tag
        id: resolve
        run: |
          PROJECTS=$(npx nx show projects --projects="tag:platform:jvm" --json --quiet | jq -c '.' || echo '[]')
          echo "projects=$PROJECTS" >> $GITHUB_OUTPUT

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 3: Build all AgentOS JARs and upload them as a GitHub Actions artifact.
  #
  # Mirrors upload-agentos-jars in release.yml -- JDK only (no pnpm for building),
  # single Gradle invocation for all projects, then stages JARs with versioned
  # names and uploads them for the prerelease job to attach.
  #
  # A single Gradle call is intentional: Gradle resolves inter-project dependencies
  # (e.g. plugins depending on agentos-sdk) more efficiently when all tasks are
  # submitted together, and the daemon warm-up cost is paid once.
  #
  # Runs in parallel with compute-jvm-projects and publish-jvm after prepare.
  # ─────────────────────────────────────────────────────────────────────────────
  build-jars:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Stamp libs.versions.toml so Gradle embeds the correct version in JAR manifests
      # and filenames. Done with sed directly -- no tsx invocation needed since we only
      # need the TOML update, not the npm publish (already done in prepare).
      - name: Stamp Gradle version in libs.versions.toml
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          sed -i "s/^agentosSdk = .*/agentosSdk = \"${VERSION}\"/" agentos/gradle/libs.versions.toml
          sed -i "s/^agentosService = .*/agentosService = \"${VERSION}\"/" agentos/gradle/libs.versions.toml
          echo "Stamped libs.versions.toml with version ${VERSION}"
          grep -E '^(agentosSdk|agentosService) =' agentos/gradle/libs.versions.toml

      # Derive Gradle tasks from the project list and type tags, then build all at once.
      # type:app -> :<name>:bootJar  (Spring Boot fat jar, no version in filename)
      # type:lib -> :<name>:jar      (standard jar, Gradle embeds version in filename)
      - name: Resolve Gradle tasks
        id: gradle
        run: |
          PROJECTS=$(npx nx show projects --projects="tag:platform:jvm" --json --quiet | jq -r '.[]')
          TASKS=""
          for PROJECT in $PROJECTS; do
            TAGS=$(npx nx show project "$PROJECT" --json --quiet | jq -r '.tags[]')
            if echo "$TAGS" | grep -q "type:app"; then
              TASKS="$TASKS :${PROJECT}:bootJar"
            else
              TASKS="$TASKS :${PROJECT}:jar"
            fi
          done
          echo "tasks=$(echo $TASKS | xargs)" >> $GITHUB_OUTPUT

      - name: Grant execute permission for gradlew
        working-directory: agentos
        run: chmod +x gradlew

      - name: Build AgentOS JARs
        working-directory: agentos
        run: ./gradlew ${{ steps.gradle.outputs.tasks }} --no-daemon

      # Naming contract: "<artifactId>-<version>.jar" -- identical to release.yml.
      # type:app: bootJar produces <name>.jar (no version suffix) -> rename explicitly.
      # type:lib: jar produces <name>-<version>.jar                -> copy as-is.
      - name: Stage JARs with versioned names
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          PROJECTS=$(npx nx show projects --projects="tag:platform:jvm" --json --quiet | jq -r '.[]')
          mkdir -p /tmp/agentos-jars

          for PROJECT in $PROJECTS; do
            TAGS=$(npx nx show project "$PROJECT" --json --quiet | jq -r '.tags[]')
            if echo "$TAGS" | grep -q "type:app"; then
              cp "agentos/${PROJECT}/build/libs/${PROJECT}.jar" \
                 "/tmp/agentos-jars/${PROJECT}-${VERSION}.jar"
            else
              cp agentos/${PROJECT}/build/libs/${PROJECT}-*.jar /tmp/agentos-jars/
            fi
          done

          cd /tmp/agentos-jars
          sha256sum *.jar > checksums.sha256
          echo "Staged files:"
          cat checksums.sha256

      - name: Upload staged JARs
        uses: actions/upload-artifact@v4
        with:
          name: agentos-jars
          path: /tmp/agentos-jars/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 4: Publish each JVM artifact to GitHub Packages.
  #
  # Mirrors publish-agentos-artifacts in release.yml exactly -- matrix over
  # jvm projects, fail-fast: false, each runner stamps libs.versions.toml with
  # sed and calls `pnpm nx publish <project>` (which invokes Gradle publish).
  #
  # Runs in parallel with build-jars after compute-jvm-projects completes.
  # ─────────────────────────────────────────────────────────────────────────────
  publish-jvm:
    name: publish ${{ matrix.project }} to github packages
    runs-on: ubuntu-latest
    needs: [prepare, compute-jvm-projects]
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.compute-jvm-projects.outputs.projects) }}
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Grant execute permission for gradlew
        working-directory: agentos
        run: chmod +x gradlew

      - name: Stamp Gradle version in libs.versions.toml
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          sed -i "s/^agentosSdk = .*/agentosSdk = \"${VERSION}\"/" agentos/gradle/libs.versions.toml
          sed -i "s/^agentosService = .*/agentosService = \"${VERSION}\"/" agentos/gradle/libs.versions.toml
          echo "Stamped libs.versions.toml with version ${VERSION}"
          grep -E '^(agentosSdk|agentosService) =' agentos/gradle/libs.versions.toml

      - name: Publish to GitHub Packages
        run: pnpm nx publish ${{ matrix.project }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

  # ─────────────────────────────────────────────────────────────────────────────
  # Job 5: Create the GitHub prerelease and attach all staged JARs.
  #
  # Waits for build-jars (JARs ready) and publish-jvm (packages published) so
  # the release is only visible once the full artifact set is coherent.
  #
  # Tag format: workstream-<slug>-<n>  e.g. workstream-forge-4
  # FLAT and DASH-ONLY by design -- no slashes (see rule 1 above).
  # The tag was already pushed by the "Reserve workstream tag" step in prepare,
  # so `gh release create` attaches to the existing tag without needing --target.
  # ─────────────────────────────────────────────────────────────────────────────
  prerelease:
    runs-on: ubuntu-latest
    needs: [prepare, build-jars, publish-jvm]
    permissions:
      contents: write
    steps:
      - name: Download staged JARs
        uses: actions/download-artifact@v4
        with:
          name: agentos-jars
          path: /tmp/agentos-jars

      - name: Create GitHub prerelease and upload JARs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.prepare.outputs.version }}"
          SLUG="${{ needs.prepare.outputs.slug }}"
          TAG="${{ needs.prepare.outputs.tag }}"

          NOTES="Prerelease artifact set for workstream ${SLUG}, version ${VERSION}."
          NOTES="${NOTES} npm dist-tag: workstream-${SLUG}."
          NOTES="${NOTES} Published from ${{ github.ref_name }} at ${{ github.sha }}."
          NOTES="${NOTES} This is a prerelease -- do not use in production."

          gh release create "$TAG" \
            --prerelease \
            --title "Workstream ${SLUG} #${TAG##*-} - ${VERSION}" \
            --notes "$NOTES" \
            /tmp/agentos-jars/*.jar \
            /tmp/agentos-jars/checksums.sha256

          echo "::notice::Prerelease published: ${TAG}"
