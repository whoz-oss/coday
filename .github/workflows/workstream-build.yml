# Workstream Build -- publishes a coherent prerelease artifact set on every push to integration/**.
#
# Triggered by:
#   - promote-to-integration (validate.yml) pushing a merged work branch
#   - integration-reset.yml force-resetting the branch after a workstream merge
#
# Three inviolable rules this workflow enforces:
#   1. NEVER create a release/* tag. Doing so corrupts the next real release's
#      version derivation (nx release walks conventional commits from the last tag).
#      Workstream tags live in: workstream/<slug>/<version>
#   2. NEVER run releaseChangelog. It commits/tags/pushes -- all wrong here.
#      Version stamps live only in the working tree and are never committed.
#   3. NEVER publish to the 'latest' npm dist-tag. npm publishes use
#      --tag workstream-<slug>. Publishing to 'latest' would reach every consumer.
#
# Desktop apps (desktop/desktop-twin) are NOT built here -- they have no-op
# nx-release-publish targets and are excluded from workstream builds.
#
# RELEASE_PAT is NOT used for pushes here because this workflow is triggered BY
# a push (from validate.yml or integration-reset.yml) -- it does not push itself.

name: Workstream Build

on:
  push:
    branches:
      - 'integration/**'

# Serialise builds per workstream slug.
# cancel-in-progress: false is mandatory -- cancelling mid-publish can leave a
# partial artifact set that appears coherent but is missing packages.
#
# group resolves to e.g. "workstream-talent-portal" for slug "talent-portal".
# github.ref_name for an integration push is "integration/<slug>", so
# split(..., '/')[1] extracts the slug.
#
# This group MUST match the group in validate.yml (promote-to-integration) and
# integration-reset.yml so that a build, promote, and reset for the same slug
# are never concurrent. All three use split(..., '/')[1] on their respective
# context variable (ref_name vs base_ref) but the slug segment is always [1].
concurrency:
  group: workstream-${{ split(github.ref_name, '/')[1] }}
  cancel-in-progress: false

env:
  NX_MAX_WORKERS: 4

defaults:
  run:
    shell: bash

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      # contents: write -- create GitHub prerelease and upload assets
      contents: write
      # packages: write -- publish JVM artifacts to GitHub Packages
      packages: write
      # id-token: write -- required for npm OIDC trusted publishing (no static token needed)
      id-token: write
    env:
      NPM_CONFIG_PROVENANCE: true
    steps:
      # fetch-depth: 0 is MANDATORY.
      # Version computation requires: git tag --list 'release/*'
      # A shallow clone produces an empty tag list and the version step fails.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      # registry-url is required for npm OIDC trusted publishing.
      # npm auth uses OIDC (id-token: write above), matching release.yml exactly.
      # No static NPM_TOKEN / NODE_AUTH_TOKEN secret is required or used.
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'pnpm'
          registry-url: 'https://${{ vars.NPM_REGISTRY }}'

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # github.ref_name is the short branch name, e.g. "integration/talent-portal".
      # Strip the "integration/" prefix to get the slug.
      - name: Derive slug
        id: slug
        run: |
          REF_NAME="${{ github.ref_name }}"
          SLUG="${REF_NAME#integration/}"
          echo "slug=${SLUG}" >> $GITHUB_OUTPUT
          echo "Workstream slug: ${SLUG}"

      # Version format: <major>.<minor>.<patch+1>-<slug>.<run_number>
      # Example:        0.241.1-talent-portal.47
      #
      # CRITICAL: use --sort=-v:refname, NOT the default lexicographic sort.
      # Lexicographic is WRONG: "release/0.9.0" sorts AFTER "release/0.241.0"
      # because '9' > '2'. -v:refname applies semver-aware ordering to the full
      # refname, so 0.241.0 correctly sorts after 0.9.0.
      #
      # Note on patch increment: we always increment patch regardless of what the
      # next real release will be. If master subsequently cuts a minor release,
      # the prerelease version will sort below it -- which is correct behaviour
      # (prereleases are not guarantees of the next release version). Consumers
      # install prereleases by exact version or dist-tag, never by range, so
      # semver ordering of prereleases relative to future releases is irrelevant.
      - name: Compute version
        id: version
        run: |
          SLUG="${{ steps.slug.outputs.slug }}"

          LAST_TAG=$(git tag --list 'release/*' --sort=-v:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            echo "ERROR: no release/* tags found." >&2
            echo "This usually means fetch-depth: 0 was not set on the checkout step." >&2
            exit 1
          fi

          echo "Last release tag: ${LAST_TAG}"
          IFS='.' read -r major minor patch <<< "${LAST_TAG#release/}"

          # Defensive: ensure the tag parsed into three numeric components.
          # A malformed tag (e.g. release/v1.2.3 with a leading 'v') would produce
          # non-numeric components and arithmetic below would fail silently or produce
          # a garbage version string.
          if ! [[ "$major" =~ ^[0-9]+$ && "$minor" =~ ^[0-9]+$ && "$patch" =~ ^[0-9]+$ ]]; then
            echo "ERROR: could not parse numeric version from tag '${LAST_TAG}'." >&2
            echo "Expected format: release/<major>.<minor>.<patch> with no leading 'v'." >&2
            exit 1
          fi

          VERSION="${major}.${minor}.$((patch + 1))-${SLUG}.${GITHUB_RUN_NUMBER}"

          echo "Computed version: ${VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      # workstream-release.ts stamps ALL package.json files and
      # agentos/gradle/libs.versions.toml with the exact version, then publishes
      # npm packages with dist-tag workstream-<slug>.
      #
      # It performs NO git operations -- version stamps live only in the working tree.
      # (Rule 2: never commit version bumps on an integration branch.)
      # (Rule 3: npm packages are published with --tag workstream-<slug>, never latest.)
      #
      # npm auth uses OIDC trusted publishing (id-token: write + registry-url on
      # setup-node above), matching release.yml exactly. No static token is needed.
      - name: Stamp versions and publish npm packages
        run: |
          npx tsx scripts/workstream-release.ts \
            --version "${{ steps.version.outputs.version }}" \
            --slug "${{ steps.slug.outputs.slug }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # libs.versions.toml has already been stamped by workstream-release.ts above,
      # so Gradle picks up the correct version automatically.
      - name: Grant execute permission for gradlew
        working-directory: agentos
        run: chmod +x gradlew

      - name: Build AgentOS JARs
        working-directory: agentos
        run: |
          ./gradlew \
            :agentos-service:bootJar \
            :agentos-bash-plugin:jar \
            :agentos-file-plugin:jar \
            :agentos-mcp-plugin:jar \
            :agentos-http-plugin:jar \
            :agentos-tmux-plugin:jar \
            :agentos-git-plugin:jar \
            --no-daemon

      # Mirrors the compute-jvm-projects + publish-agentos-artifacts approach in
      # release.yml, inlined into a single step to avoid matrix overhead.
      - name: Publish JVM artifacts to GitHub Packages
        run: |
          PROJECTS=$(npx nx show projects --projects="tag:platform:jvm" --json --quiet | jq -r '.[]')
          if [ -z "$PROJECTS" ]; then
            echo "No JVM projects found with tag:platform:jvm"
            exit 0
          fi
          echo "Publishing JVM projects: $(echo $PROJECTS | tr '\n' ' ')"
          for PROJECT in $PROJECTS; do
            echo "Publishing ${PROJECT}..."
            pnpm nx publish "$PROJECT"
          done
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      # Naming contract: "<artifactId>-<version>.jar".
      # agentos-service: bootJar forces archiveFileName="agentos-service.jar" (no version).
      # We rename it explicitly -- matching the convention in release.yml so that external
      # consumers downloading by versioned filename work identically for prereleases.
      # Plugin JARs already carry their Gradle version; we copy them as-is.
      - name: Stage JARs with versioned names
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p /tmp/agentos-jars

          cp agentos/agentos-service/build/libs/agentos-service.jar \
             "/tmp/agentos-jars/agentos-service-${VERSION}.jar"

          cp agentos/agentos-bash-plugin/build/libs/agentos-bash-plugin-*.jar   /tmp/agentos-jars/
          cp agentos/agentos-file-plugin/build/libs/agentos-file-plugin-*.jar   /tmp/agentos-jars/
          cp agentos/agentos-mcp-plugin/build/libs/agentos-mcp-plugin-*.jar     /tmp/agentos-jars/
          cp agentos/agentos-http-plugin/build/libs/agentos-http-plugin-*.jar   /tmp/agentos-jars/
          cp agentos/agentos-tmux-plugin/build/libs/agentos-tmux-plugin-*.jar   /tmp/agentos-jars/
          cp agentos/agentos-git-plugin/build/libs/agentos-git-plugin-*.jar     /tmp/agentos-jars/

          cd /tmp/agentos-jars
          sha256sum *.jar > checksums.sha256
          echo "Staged files:"
          cat checksums.sha256

      # Tag lives in workstream namespace: workstream/<slug>/<version>.
      # Rule 1: NEVER use release/* -- a release/* tag corrupts the next real
      # release's version derivation.
      # prerelease: true ensures this never appears as "latest release" in the UI.
      - name: Create GitHub prerelease and upload JARs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SLUG="${{ steps.slug.outputs.slug }}"
          TAG="workstream/${SLUG}/${VERSION}"
          BRANCH="${{ github.ref_name }}"
          SHA="${{ github.sha }}"

          echo "Creating prerelease tag: ${TAG}"

          NOTES="Prerelease artifact set for workstream ${SLUG}, version ${VERSION}."
          NOTES="${NOTES} Published from integration branch ${BRANCH} at commit ${SHA}."
          NOTES="${NOTES} This is a prerelease -- do not use in production."

          gh release create "$TAG" \
            --prerelease \
            --title "Workstream ${SLUG} - ${VERSION}" \
            --notes "$NOTES" \
            "/tmp/agentos-jars/agentos-service-${VERSION}.jar" \
            /tmp/agentos-jars/agentos-bash-plugin-*.jar \
            /tmp/agentos-jars/agentos-file-plugin-*.jar \
            /tmp/agentos-jars/agentos-mcp-plugin-*.jar \
            /tmp/agentos-jars/agentos-http-plugin-*.jar \
            /tmp/agentos-jars/agentos-tmux-plugin-*.jar \
            /tmp/agentos-jars/agentos-git-plugin-*.jar \
            /tmp/agentos-jars/checksums.sha256

          echo "::notice::Prerelease published: ${TAG}"

      - name: Write job summary
        if: always()
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          SLUG="${{ steps.slug.outputs.slug }}"
          echo "## Workstream Prerelease: ${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Workstream | ${SLUG} |" >> $GITHUB_STEP_SUMMARY
          echo "| Version | ${VERSION} |" >> $GITHUB_STEP_SUMMARY
          echo "| npm dist-tag | workstream-${SLUG} |" >> $GITHUB_STEP_SUMMARY
          echo "| GitHub tag | workstream/${SLUG}/${VERSION} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Run | ${{ github.run_id }} |" >> $GITHUB_STEP_SUMMARY
