name: run-factory
description: Start or resume one compatible industrialized workflow from a business reference or free-form intent; optionally select --workflow=<workflowType>.
commands:
  - |
    @ProductEngineer Apply the generic Factory run protocol to this business reference or intent. Select a compatible owned declaration and its definitionVersion (for BMAD: bmad-story@1.0.0), resolve its stable workflowId, then call FACTORY__get_workflow with only workflowId. When absent, create the governed instance with FACTORY__start_workflow using only workflowId, workflowType, and title; Factory selects the unique immutable definition (BMAD: bmad-story@1.0.0). Resume an existing governed workflow from its authoritative state. Keep an existing declarative workflow on FACTORY__publish_projection without implicit conversion. Halt for removed, purged, incompatible, or ambiguous definitions. Treat an optional --workflow=<workflowType> as an explicit domain-workflow selector. Preserve responsibility as executor nature: agent-authored code remains agent work; code is reserved for deterministic Factory execution. Do not ask for or guess a revision, source system, identifier syntax, or lifecycle:
    {{PARAMETERS}}
webhookEnabled: false
