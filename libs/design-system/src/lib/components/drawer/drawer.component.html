<mat-sidenav-container class="ds-drawer" style="height: 100%">
  <mat-sidenav
    class="ds-drawer__sidenav"
    [class.ds-drawer__sidenav--overlay]="isMobile()"
    [style.width]="isMobile() && mobileFullWidth() ? '100vw' : drawerWidth()"
    [opened]="open()"
    [mode]="drawerMode()"
    [position]="position()"
    (openedChange)="onOpenedChange($event)"
  >
    @if (showHandle()) {
      <div
        class="ds-drawer__resize-handle"
        [class.ds-drawer__resize-handle--end]="position() === 'end'"
        role="separator"
        aria-orientation="vertical"
        aria-label="Resize panel"
        tabindex="0"
        [attr.aria-valuenow]="currentWidth()"
        [attr.aria-valuemin]="minWidth()"
        [attr.aria-valuemax]="maxWidth()"
        (mousedown)="onResizeStart($event)"
        (keydown)="onResizeKeydown($event)"
      ></div>
    }
    <ng-content select="[dsDrawerSide]" />
  </mat-sidenav>

  <mat-sidenav-content class="ds-drawer__content">
    <ng-content select="[dsDrawerContent]" />
  </mat-sidenav-content>
</mat-sidenav-container>
