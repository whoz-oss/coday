<ds-page>
  <ds-section-header [title]="title">
    <button dsButton variant="ghost" type="button" title="Back to users" (click)="cancel()">&larr; Users</button>
  </ds-section-header>

  @if (isLoading()) {
    <p class="ds-hint">Loading…</p>
  } @else {
    <form class="ds-form" [formGroup]="form" (ngSubmit)="save()">
      <ds-group heading="Identity">
        <ds-form-field label="Email" controlId="uf-email" required>
          @if (isEditMode) {
            <span class="ds-meta">{{ form.controls.email.value }}</span>
          } @else {
            <input
              dsControl
              id="uf-email"
              type="email"
              placeholder="user@example.com"
              formControlName="email"
              autocomplete="email"
            />
          }
        </ds-form-field>
        <ds-form-field label="External ID" controlId="uf-externalId">
          <input
            dsControl
            id="uf-externalId"
            type="text"
            placeholder="External identifier"
            formControlName="externalId"
          />
        </ds-form-field>
      </ds-group>

      <ds-group heading="Profile">
        <ds-form-field label="First name" controlId="uf-firstname">
          <input
            dsControl
            id="uf-firstname"
            type="text"
            placeholder="First name"
            formControlName="firstname"
            autocomplete="given-name"
          />
        </ds-form-field>
        <ds-form-field label="Last name" controlId="uf-lastname">
          <input
            dsControl
            id="uf-lastname"
            type="text"
            placeholder="Last name"
            formControlName="lastname"
            autocomplete="family-name"
          />
        </ds-form-field>
        <ds-form-field label="Bio" controlId="uf-bio">
          <textarea dsControl id="uf-bio" placeholder="A short description" formControlName="bio" rows="4"></textarea>
        </ds-form-field>
      </ds-group>

      <ds-group heading="Permissions">
        <label dsCheck>
          <input id="uf-isAdmin" type="checkbox" formControlName="isAdmin" />
          Super admin (full access to AgentOS)
        </label>
      </ds-group>

      <ds-form-actions>
        <button dsButton variant="primary" type="submit" [disabled]="form.invalid || isSaving()">
          {{ isSaving() ? 'Saving…' : isEditMode ? 'Save changes' : 'Create user' }}
        </button>
        <button dsButton type="button" (click)="cancel()">Cancel</button>
      </ds-form-actions>
    </form>
  }
</ds-page>
