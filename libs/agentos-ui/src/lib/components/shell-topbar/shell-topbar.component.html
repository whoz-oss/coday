<div class="shell-topbar">
  <a class="shell-topbar__brand" routerLink="/home" [queryParams]="workQueryParams()" title="Back to cases">
    <img src="CODAY-Logo.png" alt="" class="shell-topbar__logo-img" />
    <span class="shell-topbar__logo-text">Coday</span>
  </a>

  <nav class="shell-topbar__links" aria-label="AgentOS navigation">
    <a class="shell-topbar__link--work" routerLink="/home" [queryParams]="workQueryParams()">Cases</a>
    @if (activeNamespaceId(); as namespaceId) {
      <a [routerLink]="['/', namespaceId]" routerLinkActive="shell-topbar__link--active">Namespace settings</a>
    }
    <a routerLink="/namespaces" routerLinkActive="shell-topbar__link--active">Namespaces</a>
    <a routerLink="/user" routerLinkActive="shell-topbar__link--active">User settings</a>
    @if (isAdmin()) {
      <a routerLink="/admin" routerLinkActive="shell-topbar__link--active">Administration</a>
    }
  </nav>
</div>
