<div class="shell-topbar">
  <button class="shell-topbar__brand" type="button" title="Home" (click)="navigateHome()">
    <img src="CODAY-Logo.png" alt="Coday" class="shell-topbar__logo-img" />
    <span class="shell-topbar__logo-text">Coday</span>
  </button>

  <nav class="shell-topbar__links" aria-label="AgentOS navigation">
    <a routerLink="/agentos/me" routerLinkActive="shell-topbar__link--active">User settings</a>
    @if (isAdmin()) {
      <a routerLink="/agentos/admin" routerLinkActive="shell-topbar__link--active">Administration</a>
    }
    <a routerLink="/agentos/namespaces" routerLinkActive="shell-topbar__link--active">Namespaces</a>
  </nav>
</div>
