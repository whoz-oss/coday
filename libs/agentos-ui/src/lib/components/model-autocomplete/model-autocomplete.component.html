<ul class="prompt-autocomplete" role="listbox" aria-label="AI model">
  @for (option of options(); track option.label; let i = $index) {
    <li
      #modelItem
      class="prompt-autocomplete__item"
      [class.prompt-autocomplete__item--active]="isActive(i)"
      role="option"
      tabindex="-1"
      [attr.aria-selected]="isActive(i)"
      (click)="onItemClick(option)"
      (keydown.enter)="onItemClick(option)"
      (mouseenter)="activeIndex.set(i)"
    >
      <span class="prompt-autocomplete__name">/model {{ option.label }}</span>
      <span class="prompt-autocomplete__description">
        {{ option.model === null ? option.description : option.description || 'AI model'
        }}{{ isCurrent(option) ? ' · current' : '' }}
      </span>
    </li>
  }
</ul>
