<ds-page>
  <ds-section-header [title]="isEditMode() ? 'Edit skill' : 'New skill'">
    <button dsButton variant="ghost" type="button" title="Back to skills" (click)="cancel()">&larr; Skills</button>
    @if (isEditMode()) {
      <a headerMeta class="ds-link" [routerLink]="inspectRoute()">View skill &rarr;</a>
    }
    @if (isPlatformMode) {
      <ds-tag headerMeta variant="outline">Platform level</ds-tag>
    }
  </ds-section-header>

  @if (isLoading()) {
    <p class="ds-hint">Loading&hellip;</p>
  } @else {
    <form class="ds-form" [formGroup]="form" (ngSubmit)="submit()">
      <ds-form-field
        label="Name"
        controlId="skill-name"
        hint="The value an agent's skillSelectors entry must match. Letters, digits, dash, dot, underscore and single spaces; 100 characters max."
        [error]="nameControl.invalid && nameControl.touched ? 'A valid, non-empty name is required.' : null"
      >
        <input dsControl id="skill-name" type="text" autocomplete="off" [formControl]="nameControl" />
      </ds-form-field>

      <ds-form-field
        label="Description"
        controlId="skill-description"
        hint="This is what the agent sees in its skill catalog — it decides from this line alone whether to read the skill. 500 characters max."
      >
        <textarea dsControl id="skill-description" rows="2" [formControl]="descriptionControl"></textarea>
      </ds-form-field>

      <ds-form-field
        label="Body"
        controlId="skill-body"
        hint="Markdown instructions returned verbatim by the readSkill tool when the agent asks for this skill."
      >
        <textarea dsControl mono id="skill-body" rows="16" [formControl]="bodyControl"></textarea>
      </ds-form-field>

      <ds-form-field
        label="Resources"
        hint="Optional files the agent can read with readSkillResource, by relative path."
      >
        <div class="ds-stack">
          @for (row of resourceRows(); track $index) {
            <div class="ds-stack ds-stack--sm">
              <div class="ds-inline">
                <input
                  dsControl
                  mono
                  type="text"
                  placeholder="e.g. references/checklist.md"
                  aria-label="Resource path"
                  autocomplete="off"
                  [formControl]="row.path"
                />
                <button
                  dsButton
                  variant="icon-danger"
                  type="button"
                  title="Remove"
                  aria-label="Remove resource"
                  (click)="removeResource(row)"
                >
                  &times;
                </button>
              </div>
              <textarea dsControl mono rows="4" aria-label="Resource content" [formControl]="row.content"></textarea>
            </div>
          }
          <div>
            <button dsButton variant="ghost" type="button" (click)="addResource()">+ Add resource</button>
          </div>
        </div>
      </ds-form-field>

      @if (errorMessage()) {
        <ds-notice>{{ errorMessage() }}</ds-notice>
      }

      <ds-form-actions>
        <button dsButton variant="primary" type="submit" [disabled]="form.invalid || isSubmitting()">
          {{ isSubmitting() ? 'Saving…' : isEditMode() ? 'Save changes' : 'Create' }}
        </button>
        <button dsButton type="button" (click)="cancel()">Cancel</button>
      </ds-form-actions>
    </form>
  }
</ds-page>
