<div class="ai-model-form">
  <header class="ai-model-form__header">
    <button class="ai-model-form__back" type="button" (click)="cancel()" title="Back to AI models">
      <span class="ai-model-form__back-icon">&#8592;</span>
      AI models
    </button>
    <h1 class="ai-model-form__title">{{ isEditMode() ? 'Edit AI model' : 'New AI model' }}</h1>
  </header>

  @if (isLoading()) {
    <p class="ai-model-form__loading">Loading&hellip;</p>
  } @else {
    <form class="ai-model-form__form" [formGroup]="form" (ngSubmit)="submit()">
      <div class="ai-model-form__field">
        <label class="ai-model-form__label" for="model-provider"> Provider <span aria-hidden="true">*</span> </label>
        @if (isEditMode()) {
          <!-- Read-only in edit mode: provider cannot be reassigned after creation -->
          <input
            id="model-provider"
            class="ai-model-form__input ai-model-form__input--readonly"
            type="text"
            [value]="selectedProviderLabel()"
            readonly
            tabindex="-1"
          />
        } @else {
          <select id="model-provider" class="ai-model-form__select" [formControl]="aiProviderIdControl">
            <option value="" disabled>Select provider</option>
            @for (provider of providers(); track trackByProvider($index, provider)) {
              <option [value]="provider.id">{{ provider.name }} ({{ provider.apiType }})</option>
            }
          </select>
        }
      </div>

      <div class="ai-model-form__field">
        <label class="ai-model-form__label" for="model-api-name"> API name <span aria-hidden="true">*</span> </label>
        <input
          id="model-api-name"
          class="ai-model-form__input ai-model-form__input--mono"
          type="text"
          placeholder="e.g. gpt-4o, claude-3-5-sonnet-20241022"
          [formControl]="apiModelNameControl"
          autocomplete="off"
        />
      </div>

      <div class="ai-model-form__field">
        <label class="ai-model-form__label" for="model-description">Description</label>
        <input
          id="model-description"
          class="ai-model-form__input"
          type="text"
          placeholder="Optional — short description of this model config"
          [formControl]="descriptionControl"
          autocomplete="off"
        />
      </div>

      <div class="ai-model-form__field">
        <label class="ai-model-form__label" for="model-alias">Alias</label>
        <input
          id="model-alias"
          class="ai-model-form__input"
          type="text"
          placeholder="e.g. fast, smart — short identifier used internally"
          [formControl]="aliasControl"
          autocomplete="off"
        />
      </div>

      <div class="ai-model-form__field">
        <label class="ai-model-form__label" for="model-priority">Priority</label>
        <input
          id="model-priority"
          class="ai-model-form__input"
          type="number"
          placeholder="0 — higher wins when multiple configs share the same alias"
          min="0"
          step="1"
          [formControl]="priorityControl"
        />
      </div>

      <div class="ai-model-form__row">
        <div class="ai-model-form__field">
          <label class="ai-model-form__label" for="model-temperature">Temperature</label>
          <input
            id="model-temperature"
            class="ai-model-form__input"
            type="number"
            placeholder="0 – 2"
            min="0"
            max="2"
            step="0.1"
            [formControl]="temperatureControl"
          />
        </div>

        <div class="ai-model-form__field">
          <label class="ai-model-form__label" for="model-context-window">Context window</label>
          <input
            id="model-context-window"
            class="ai-model-form__input"
            type="number"
            placeholder="e.g. 128000"
            min="1"
            step="1"
            [formControl]="contextWindowControl"
          />
        </div>
      </div>

      <div class="ai-model-form__field">
        <label class="ai-model-form__label" for="model-max-completion-tokens">Max completion tokens</label>
        <input
          id="model-max-completion-tokens"
          class="ai-model-form__input"
          type="number"
          placeholder="e.g. 4096"
          min="1"
          step="1"
          [formControl]="maxCompletionTokensControl"
        />
      </div>

      <!-- Pricing section (all values per million tokens) -->
      <fieldset class="ai-model-form__section" [formGroup]="pricingGroup">
        <legend class="ai-model-form__section-title">
          Pricing
          <span class="ai-model-form__section-hint">(per million tokens — leave blank to skip cost monitoring)</span>
        </legend>

        <div class="ai-model-form__row">
          <div class="ai-model-form__field">
            <label class="ai-model-form__label" for="pricing-input">Input</label>
            <input
              id="pricing-input"
              class="ai-model-form__input"
              type="number"
              placeholder="e.g. 2.50"
              min="0"
              step="0.01"
              formControlName="inputMTokens"
            />
          </div>

          <div class="ai-model-form__field">
            <label class="ai-model-form__label" for="pricing-output">Output</label>
            <input
              id="pricing-output"
              class="ai-model-form__input"
              type="number"
              placeholder="e.g. 10.00"
              min="0"
              step="0.01"
              formControlName="outputMTokens"
            />
          </div>
        </div>

        <div class="ai-model-form__row">
          <div class="ai-model-form__field">
            <label class="ai-model-form__label" for="pricing-cache-write">Cache write</label>
            <input
              id="pricing-cache-write"
              class="ai-model-form__input"
              type="number"
              placeholder="e.g. 3.75"
              min="0"
              step="0.01"
              formControlName="cacheWrite"
            />
          </div>

          <div class="ai-model-form__field">
            <label class="ai-model-form__label" for="pricing-cache-read">Cache read</label>
            <input
              id="pricing-cache-read"
              class="ai-model-form__input"
              type="number"
              placeholder="e.g. 0.30"
              min="0"
              step="0.01"
              formControlName="cacheRead"
            />
          </div>
        </div>
      </fieldset>

      <div class="ai-model-form__actions">
        <button
          class="ai-model-form__btn ai-model-form__btn--primary"
          type="submit"
          [disabled]="form.invalid || isSubmitting()"
        >
          {{ isEditMode() ? 'Save changes' : 'Create' }}
        </button>
        <button class="ai-model-form__btn" type="button" (click)="cancel()">Cancel</button>
      </div>
    </form>
  }
</div>
