<ds-entity-list
  title="Platform Skills"
  [items]="(skillItems$ | async) ?? []"
  [loading]="isLoading()"
  [showCreate]="true"
  emptyMessage="No platform skills defined yet. Add one above."
  cardMinWidth="400px"
  [itemTemplate]="skillItemTpl"
  (createRequested)="openCreateForm()"
>
  <ds-icon-button toolbar-start icon="arrow_back" title="Back" (action)="goBack()" />
</ds-entity-list>

<!-- Item template: renders SkillItemComponent for each entity-list card slot -->
<ng-template #skillItemTpl let-item>
  @if (resolveSkill(item.id); as skill) {
    <agentos-skill-item [skill]="skill" [platformMode]="true" (deleteRequested)="deleteSkill($event)" />
  }
</ng-template>
