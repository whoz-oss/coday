<ds-entity-list
  title="Scheduled Prompts"
  [items]="promptItems()"
  [showCreate]="true"
  emptyMessage="No scheduled prompts yet. Create one to get started."
  cardMinWidth="420px"
  [itemTemplate]="scheduledPromptItemTpl"
  (createRequested)="openCreateForm()"
>
  <ds-icon-button toolbar-start icon="arrow_back" title="Back" (action)="goBack()" />
</ds-entity-list>

<ng-template #scheduledPromptItemTpl let-item>
  @if (resolvePrompt(item.id); as definition) {
    <agentos-scheduled-prompt-item
      [definition]="definition"
      [namespaceId]="namespaceId"
      [readOnly]="isPlatformPrompt(item.id)"
      (enableRequested)="enablePrompt($event)"
      (disableRequested)="disablePrompt($event)"
      (deleteRequested)="deletePrompt($event)"
    />
  }
</ng-template>
