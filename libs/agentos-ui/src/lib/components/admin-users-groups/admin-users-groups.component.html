<ds-page>
  <ds-section-header title="Users &amp; groups" description="Platform users, and the user groups of each namespace." />

  <div class="ds-stack">
    <ds-segmented
      mode="tabs"
      label="Users and Groups"
      panelId="admin-users-groups-panel"
      [options]="tabs"
      [value]="activeTab()"
      (valueChange)="setTab($event)"
    />

    <div
      id="admin-users-groups-panel"
      role="tabpanel"
      tabindex="0"
      [attr.aria-labelledby]="activeTab() === 'users' ? 'admin-tab-users' : 'admin-tab-groups'"
    >
      @if (activeTab() === 'users') {
        <agentos-user-list
          [namespaces]="namespaces()"
          [selectedNamespaceId]="usersNamespaceFilter()"
          (namespaceFilterChange)="onUsersNamespaceChange($event)"
        />
      } @else {
        @if (namespaces().length === 0) {
          <p class="settings-table__status">No namespaces yet. Create one before managing groups.</p>
        } @else if (groupsNamespaceId(); as namespaceId) {
          <agentos-user-group-list
            [namespaceId]="namespaceId"
            [namespaces]="namespaces()"
            [returnTo]="returnTo()"
            (namespaceChange)="onGroupsNamespaceChange($event)"
          />
        }
      }
    </div>
  </div>
</ds-page>
