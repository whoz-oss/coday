<ds-section-header title="Platform Auth Settings">
  <agentos-table-filter
    label="Filter auth settings"
    placeholder="Filter auth settings…"
    [query]="rowFilter.query()"
    (queryChange)="rowFilter.query.set($event)"
  />
  <button class="settings-table__new" type="button" (click)="openCreateForm()">New auth setting</button>
</ds-section-header>

<ds-entity-list
  class="platform-auth-settings__content"
  title="Platform Auth Settings"
  [hideTitle]="true"
  [hideToolbar]="true"
  [items]="settingItems()"
  [loading]="isLoading()"
  [showCreate]="false"
  emptyMessage="No platform auth settings defined yet."
  cardMinWidth="400px"
  [itemTemplate]="authSettingItemTpl"
/>

<ng-template #authSettingItemTpl let-item>
  @if (resolveSetting(item.id); as setting) {
    <agentos-auth-setting-item
      [config]="setting"
      scope="namespace"
      [showBadge]="false"
      (editRequested)="onEdit($event)"
      (deleteRequested)="onDelete($event)"
    />
  }
</ng-template>
