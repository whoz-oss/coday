@if (notificationsSupported) {
  <button
    class="shell-user-menu__item"
    [class.shell-user-menu__item--active]="browserNotifications.enabled()"
    type="button"
    (click)="browserNotifications.toggle()"
  >
    <svg
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
      <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
    </svg>
    Notifications
    @if (browserNotifications.enabled()) {
      <span class="shell-user-menu__item-badge">On</span>
    }
  </button>
}

@if (companionSupported) {
  <button
    class="shell-user-menu__item"
    [class.shell-user-menu__item--active]="companionPip.companionEnabled()"
    type="button"
    (click)="companionPip.toggle()"
  >
    <svg
      width="15"
      height="15"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="1.5"
      stroke-linecap="round"
      stroke-linejoin="round"
      aria-hidden="true"
    >
      <rect width="18" height="14" x="3" y="4" rx="1" />
      <path d="M3 9h18" />
    </svg>
    Companion
    @if (companionPip.companionEnabled()) {
      <span class="shell-user-menu__item-badge">On</span>
    }
  </button>
}
