<ds-copy-button [text]="text()" title="Copy message" />
@if (editable()) {
  <ds-icon-button
    icon="refresh"
    inputTrack="CaseChat-reloadMessage"
    [title]="reloadTooltip"
    (action)="reloadRequested.emit()"
  />
  <ds-icon-button icon="edit" inputTrack="CaseChat-editMessage" [title]="editTooltip" (action)="editRequested.emit()" />
}
