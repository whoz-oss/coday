<ds-page>
  <ds-section-header [title]="isEditMode() ? 'Edit AI provider' : 'New AI provider'">
    <button dsButton variant="ghost" type="button" title="Back to AI providers" (click)="cancel()">
      &larr; AI providers
    </button>
  </ds-section-header>

  @if (isLoading()) {
    <p class="ds-hint">Loading&hellip;</p>
  } @else {
    <form class="ds-form" [formGroup]="form" (ngSubmit)="submit()">
      @if (!isPlatformMode) {
        <ds-fieldset legend="Configuration scope" [disabled]="isEditMode()">
          @for (opt of scopeOptions; track trackByScope($index, opt)) {
            <label dsCheck>
              <input
                type="radio"
                [formControl]="scopeControl"
                [value]="opt.value"
                [disabled]="opt.value === 'namespace' && !isAdmin()"
              />
              {{ opt.label }}
            </label>
          }
        </ds-fieldset>
      }

      <ds-form-field label="API type" controlId="llm-api-type" required>
        <select dsControl id="llm-api-type" [formControl]="apiTypeControl">
          @for (type of apiTypeOptions; track type) {
            <option [value]="type">{{ type }}</option>
          }
        </select>
      </ds-form-field>

      <ds-form-field label="Name" controlId="llm-name" required>
        <input
          dsControl
          id="llm-name"
          type="text"
          placeholder="e.g. OpenAI prod"
          [formControl]="nameControl"
          autocomplete="off"
        />
      </ds-form-field>

      <ds-form-field label="Description" controlId="llm-description">
        <input
          dsControl
          id="llm-description"
          type="text"
          placeholder="Optional — short description of this provider"
          [formControl]="descriptionControl"
          autocomplete="off"
        />
      </ds-form-field>

      <ds-form-field label="Base URL" controlId="llm-base-url">
        <input
          dsControl
          id="llm-base-url"
          type="url"
          placeholder="Optional — leave empty for default endpoint"
          [formControl]="baseUrlControl"
          autocomplete="off"
        />
      </ds-form-field>

      <ds-form-field label="API key" controlId="llm-api-key">
        <input
          dsControl
          id="llm-api-key"
          type="password"
          placeholder="sk-…"
          [formControl]="apiKeyControl"
          autocomplete="new-password"
        />
      </ds-form-field>

      <ds-form-field label="Custom headers">
        <div class="ds-stack ds-stack--sm" [formArrayName]="'headers'">
          @for (headerGroup of headersArray.controls; track $index) {
            <div class="ds-inline" [formGroupName]="$index">
              <input dsControl type="text" placeholder="Header name" formControlName="key" autocomplete="off" />
              <input dsControl type="text" placeholder="Value" formControlName="value" autocomplete="off" />
              <button
                dsButton
                variant="icon-danger"
                type="button"
                title="Remove header"
                aria-label="Remove header"
                (click)="removeHeader($index)"
              >
                &times;
              </button>
            </div>
          }
          <div>
            <button dsButton variant="ghost" type="button" (click)="addHeader()">+ Add header</button>
          </div>
        </div>
      </ds-form-field>

      <ds-form-actions>
        <button dsButton variant="primary" type="submit" [disabled]="form.invalid || isSubmitting()">
          {{ isEditMode() ? 'Save changes' : 'Create' }}
        </button>
        <button dsButton type="button" (click)="cancel()">Cancel</button>
      </ds-form-actions>
    </form>
  }
</ds-page>
