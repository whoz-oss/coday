<agentos-settings-layout
  [title]="namespaceName() + ' · Configuration'"
  [mark]="namespaceName().charAt(0).toUpperCase()"
  [navigationLabel]="namespaceName() + ' settings'"
  [groups]="navigationGroups()"
>
  <nav settingsBreadcrumb aria-label="Breadcrumb">
    <a routerLink="/agentos/namespaces">Namespaces</a>
    <span aria-hidden="true">/</span>
    <span>{{ namespaceName() }}</span>
  </nav>

  <button settingsHeaderAction class="settings-header__open" type="button" (click)="openNamespace()">
    Open namespace
  </button>

  <router-outlet />
</agentos-settings-layout>
