<div class="exchange-shell">
  @if (actionError()) {
    <p class="exchange-shell__upload-error" role="alert">{{ actionError() }}</p>
  }

  <agentos-exchange-drawer
    class="exchange-shell__drawer"
    [caseId]="environmentCaseId()"
    [environmentActive]="active()"
    [caseFiles]="caseBrowseUnavailable() ? [] : state.caseFiles()"
    [caseFolders]="caseBrowseUnavailable() ? [] : state.caseFolders()"
    [caseBreadcrumb]="caseBrowseUnavailable() ? [] : state.caseBreadcrumb()"
    [caseHasMore]="!caseBrowseUnavailable() && state.caseHasMore()"
    [caseLoadingMore]="state.caseLoadingMore()"
    [caseStatus]="caseBrowseUnavailable() ? 'error' : state.caseStatus()"
    [caseSectionVisible]="caseBrowseUnavailable() || state.caseSectionVisible()"
    [canWriteCase]="!caseBrowseUnavailable() && state.canWriteCase()"
    [caseUploading]="state.caseUploading()"
    [caseManifest]="caseManifest()"
    [caseManifestStatus]="caseManifestStatus()"
    [namespaceFiles]="namespaceBrowseUnavailable() ? [] : state.namespaceFiles()"
    [namespaceFolders]="namespaceBrowseUnavailable() ? [] : state.namespaceFolders()"
    [namespaceBreadcrumb]="namespaceBrowseUnavailable() ? [] : state.namespaceBreadcrumb()"
    [namespaceHasMore]="!namespaceBrowseUnavailable() && state.namespaceHasMore()"
    [namespaceLoadingMore]="state.namespaceLoadingMore()"
    [namespaceStatus]="namespaceBrowseUnavailable() ? 'error' : state.namespaceStatus()"
    [namespaceSectionVisible]="namespaceBrowseUnavailable() || state.namespaceSectionVisible()"
    [canWriteNamespace]="!namespaceBrowseUnavailable() && state.canWriteNamespace()"
    [namespaceUploading]="state.namespaceUploading()"
    [namespaceManifest]="namespaceManifest()"
    [namespaceManifestStatus]="namespaceManifestStatus()"
    [activeFile]="selectedFile()"
    [selectedContent]="selectedContent()"
    [contentStatus]="contentStatus()"
    [canViewSelected]="canViewSelected()"
    (fileSelected)="onFileSelected($event)"
    (folderOpened)="onFolderOpened($event)"
    (loadMoreRequested)="state.loadMore($event)"
    (uploadRequested)="onUpload($event)"
    (downloadRequested)="onDownload($event)"
    (downloadAllRequested)="onDownloadAll($event)"
    (deleteRequested)="onDeleteRequest($event)"
    (retryRequested)="onRetry()"
    (filterChanged)="onFilterChanged($event)"
    (filterRetry)="onFilterRetry($event)"
    (viewerClosed)="onViewerClosed()"
    (closeRequested)="onClose()"
  />
</div>

<ds-confirm-dialog
  [open]="confirmOpen()"
  title="Delete file"
  [message]="deleteMessage()"
  confirmLabel="Delete"
  cancelLabel="Cancel"
  (confirmed)="onConfirmDelete()"
  (cancelled)="onCancelDelete()"
/>
