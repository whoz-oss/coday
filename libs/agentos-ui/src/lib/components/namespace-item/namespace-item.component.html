<agentos-action-card
  [name]="namespace().name"
  [description]="namespace().description ?? null"
  [menuItems]="pendingDelete() ? [] : menuItems"
  (nameClicked)="onSelect()"
  (menuAction)="onMenuAction($event)"
>
  <ng-container agentosCardActions>
    @if (pendingDelete()) {
      <span class="ns-confirm-label">Delete this namespace?</span>
      <ds-icon-button icon="check" variant="danger" title="Confirm deletion" (action)="onDeleteConfirmed()" />
      <ds-icon-button icon="close" title="Cancel" (action)="onDeleteCancelled()" />
    } @else {
      <button class="ns-action ns-action--primary" type="button" (click)="onSelect()">Open</button>
      <button class="ns-action" type="button" (click)="onIntegrations()">Configure</button>
    }
  </ng-container>
</agentos-action-card>
