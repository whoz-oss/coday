<ds-page>
  <ds-section-header [title]="isEditMode() ? 'Edit auth setting' : 'New auth setting'">
    <button dsButton variant="ghost" type="button" title="Back to auth settings" (click)="cancel()">
      &larr; Auth settings
    </button>
  </ds-section-header>

  @if (isLoading()) {
    <p class="ds-hint">Loading&hellip;</p>
  } @else {
    <form class="ds-form" [formGroup]="form" (ngSubmit)="submit()">
      @if (!isPlatformMode) {
        <ds-fieldset legend="Configuration scope" [disabled]="isEditMode()">
          @for (opt of scopeOptions; track trackByScope($index, opt)) {
            <label dsCheck>
              <input
                type="radio"
                [formControl]="scopeControl"
                [value]="opt.value"
                [disabled]="opt.value === 'namespace' && !isAdmin()"
              />
              {{ opt.label }}
            </label>
          }
        </ds-fieldset>
      }

      <ds-form-field label="Auth type" controlId="as-auth-type" required>
        <select dsControl id="as-auth-type" [formControl]="authTypeControl">
          @for (type of authTypeOptions; track type) {
            <option [value]="type">{{ authTypeLabel[type] }}</option>
          }
        </select>
      </ds-form-field>

      <ds-form-field label="Name" controlId="as-name" required>
        <input
          dsControl
          id="as-name"
          type="text"
          placeholder="e.g. GitHub OAuth App"
          [formControl]="nameControl"
          autocomplete="off"
        />
      </ds-form-field>

      <ds-form-field label="Description" controlId="as-description">
        <input
          dsControl
          id="as-description"
          type="text"
          placeholder="Optional — short description of this auth setting"
          [formControl]="descriptionControl"
          autocomplete="off"
        />
      </ds-form-field>

      @if (credentialFields().length > 0) {
        <ds-fieldset
          legend="Credentials"
          [hint]="
            'Values are stored encrypted and masked on read.' +
            (isEditMode() ? ' Leave a field unchanged to keep the stored credential.' : '')
          "
        >
          @for (field of credentialFields(); track trackByField($index, field)) {
            @if (controlForField(field.key); as ctrl) {
              <ds-form-field
                [label]="field.label"
                [controlId]="'as-cred-' + field.key"
                [required]="field.required"
                [hint]="field.hint ?? null"
                [hintId]="'as-hint-' + field.key"
              >
                <input
                  dsControl
                  [id]="'as-cred-' + field.key"
                  [type]="field.secret ? 'password' : 'text'"
                  [placeholder]="field.placeholder"
                  [formControl]="ctrl"
                  [autocomplete]="field.secret ? 'new-password' : 'off'"
                  [attr.aria-describedby]="field.hint ? 'as-hint-' + field.key : null"
                />
              </ds-form-field>
            }
          }
        </ds-fieldset>
      }

      <ds-form-actions>
        <button dsButton variant="primary" type="submit" [disabled]="form.invalid || isSubmitting()">
          {{ isEditMode() ? 'Save changes' : 'Create' }}
        </button>
        <button dsButton type="button" (click)="cancel()">Cancel</button>
      </ds-form-actions>
    </form>
  }
</ds-page>
