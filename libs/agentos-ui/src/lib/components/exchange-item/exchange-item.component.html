<div
  class="exchange-item"
  [class.exchange-item--active]="active()"
  [class.exchange-item--missing]="row().missing"
  [attr.data-git-status]="row().gitStatus ?? null"
>
  @if (selectable() && !row().missing) {
    <input
      class="exchange-item__select"
      type="checkbox"
      [checked]="selected()"
      [attr.aria-label]="'Select ' + row().filename"
      (change)="onToggle($event)"
    />
  }
  <button
    class="exchange-item__main"
    type="button"
    [attr.data-exchange-path]="row().path"
    [title]="row().filename"
    [attr.aria-current]="active() ? 'true' : null"
    [attr.aria-label]="(row().missing ? 'View deletion diff for ' : 'View ') + row().filename"
    (click)="viewRequested.emit()"
  >
    <span class="exchange-item__icon material-icons" aria-hidden="true">{{ row().icon }}</span>
    <span class="exchange-item__text">
      <span class="exchange-item__name">{{ row().filename }}</span>
      <span class="exchange-item__meta">
        {{ row().meta }}
        @for (badge of row().badges; track badge.label) {
          <span class="exchange-item__badge exchange-item__badge--{{ badge.variant }}">{{ badge.label }}</span>
        }
      </span>
    </span>
  </button>

  @if (row().gitStatus; as status) {
    <button
      type="button"
      class="exchange-item__git-status"
      [title]="gitLabels[status].label + ' · branch and local changes · View diff'"
      [attr.aria-label]="gitLabels[status].label + ': ' + row().filename + ' — View diff'"
      (click)="diffRequested.emit()"
    >
      {{ gitLabels[status].code }}
    </button>
  }

  <div class="exchange-item__actions" [class.exchange-item__actions--hidden]="row().missing">
    <ds-icon-button
      [icon]="copyState() === 'copied' ? 'check' : 'content_copy'"
      variant="default"
      [title]="copyState() === 'copied' ? 'Copied' : copyState() === 'failed' ? 'Copy failed' : 'Copy relative path'"
      (action)="copyPath()"
    />
    <ds-icon-button
      icon="download"
      variant="default"
      [title]="'Download ' + row().filename"
      (action)="downloadRequested.emit()"
    />
    @if (canWrite()) {
      <ds-icon-button
        icon="delete"
        variant="danger"
        [title]="'Delete ' + row().filename"
        (action)="deleteRequested.emit()"
      />
    }
  </div>

  <span class="exchange-item__sr-only" aria-live="polite">{{ copyState() === 'copied' ? 'Path copied' : '' }}</span>
</div>
