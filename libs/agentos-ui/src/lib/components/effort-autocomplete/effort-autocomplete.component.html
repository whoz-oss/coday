<!-- The options never take the focus: a mousedown would move it to the option, then lose it to the body once
     the list is gone. Cancelled, the focus stays on the chip or on the textarea that owns the picker. -->
<ul
  class="prompt-autocomplete"
  role="listbox"
  aria-label="Reasoning effort"
  [id]="listboxId()"
  (mousedown)="$event.preventDefault()"
>
  @for (option of options(); track option.label; let i = $index) {
    <li
      #effortItem
      class="prompt-autocomplete__item"
      [class.prompt-autocomplete__item--active]="isActive(i)"
      role="option"
      tabindex="-1"
      [id]="optionId(i)"
      [attr.aria-selected]="isCurrent(option)"
      (click)="onItemClick(option)"
      (keydown.enter)="onItemClick(option)"
      (mouseenter)="activeIndex.set(i)"
    >
      <span class="prompt-autocomplete__name">/effort {{ option.label }}</span>
      <span class="prompt-autocomplete__description">
        {{ option.description }}{{ isCurrent(option) ? ' · current' : '' }}
      </span>
    </li>
  }
</ul>
