<ds-page>
  <ds-section-header title="Launch loop agent">
    <button dsButton variant="ghost" type="button" title="Back to agent config" (click)="back()">
      &larr; Edit agent config
    </button>
  </ds-section-header>

  <p class="ds-hint">
    The loop configuration below is read from <code>AgentConfig.loopConfig</code> and will be used by the backend when
    the agent loop starts. A new Case will be created and one child case will be launched per entity found.
  </p>

  <ds-form-field label="Loop configuration (read-only)" controlId="agent-loop-payload">
    <textarea
      dsControl
      mono
      id="agent-loop-payload"
      rows="15"
      [value]="payloadJson()"
      [disabled]="isLaunching() || isLoading()"
      readonly
      spellcheck="false"
      autocomplete="off"
    ></textarea>
  </ds-form-field>

  @if (launchError()) {
    <ds-notice>{{ launchError() }}</ds-notice>
  }

  <ds-form-actions>
    <button dsButton variant="primary" type="button" [disabled]="isLaunching()" (click)="launch()">
      {{ isLaunching() ? 'Launching\u2026' : 'Launch' }}
    </button>
    <button dsButton type="button" [disabled]="isLaunching()" (click)="back()">Cancel</button>
  </ds-form-actions>
</ds-page>
