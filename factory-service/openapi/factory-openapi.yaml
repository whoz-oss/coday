      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeMapStringObject"
    delete:
      tags:
      - workflows
      summary: Purge a removed workflow projection (DELETE form).
      operationId: purgeDeleteWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
