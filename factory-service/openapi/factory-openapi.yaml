      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      - name: state
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
    post:
      tags:
      - workflows
      summary: Open a human interaction at an exact workflow revision.
      operationId: openInteractionWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/interactions/{interactionId}/reply:
    post:
      tags:
      - workflows
      summary: Reply to a human interaction atomically.
      operationId: replyInteractionWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: interactionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/evidence:
    get:
      tags:
      - workflows
      summary: List workflow evidence.
      operationId: listEvidenceWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      - name: stepId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
