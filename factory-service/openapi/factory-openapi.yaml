openapi: 3.1.0
info:
  title: Factory Service API
  description: REST API for the Factory Service — autonomous Kotlin/Spring Boot backend
  version: 0.0.1
servers:
- url: http://localhost:18141
  description: Generated server url
tags:
- name: work-environments
  description: Work-unit environment provisioning control plane
- name: delivery
  description: Governed delivery control plane
- name: delivery-operations
  description: "Delivery deployment, verification and rollback control plane"
- name: oracles
  description: Oracle definitions and execution runs
paths:
  /api/factory/workflows/{workflowId}/steps/{stepId}/oracles/{oracleId}/runs:
    post:
      tags:
      - oracles
      summary: Run an oracle against a workflow step
      description: Starts (or idempotently replays) one oracle execution for the given
        step.
      operationId: runOracle
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: stepId
        in: path
        required: true
        schema:
          type: string
      - name: oracleId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OracleRunRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOracleRunResponse"
  /api/factory/workflows/{workflowId}/environment/release:
    post:
      tags:
      - work-environments
      summary: Release (decommission) the workflow environment
      operationId: releaseWorkUnitEnvironment
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReleaseEnvironmentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentDataEnvelopeEnvironmentResponse"
  /api/factory/workflows/{workflowId}/environment/reconcile:
    post:
      tags:
      - work-environments
      summary: Reconcile the workflow environment against its Git worktree
      operationId: reconcileWorkUnitEnvironment
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentDataEnvelopeEnvironmentResponse"
  /api/factory/workflows/{workflowId}/environment/provision:
    post:
      tags:
      - work-environments
      summary: Provision (or idempotently reuse) the workflow environment
      operationId: provisionWorkUnitEnvironment
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionEnvironmentRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentDataEnvelopeEnvironmentResponse"
  /api/factory/workflows/{workflowId}/delivery/verify:
    post:
      tags:
      - delivery-operations
      summary: Create and execute a production-verification operation
      operationId: verifyDeliveryOperation
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/rollbacks:
    post:
      tags:
      - delivery-operations
      summary: Create a rollback request bound to a trusted target
      operationId: requestRollbackDeliveryOperation
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/rollbacks/{rollbackRequestId}/verify:
    post:
      tags:
      - delivery-operations
      summary: Create and execute a rollback-verification operation
      operationId: verifyRollbackDeliveryOperation
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: rollbackRequestId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/rollbacks/{rollbackRequestId}/execute:
    post:
      tags:
      - delivery-operations
      summary: Create and execute a rollback operation
      operationId: executeRollbackDeliveryOperation
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: rollbackRequestId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/rollbacks/{rollbackRequestId}/approve:
    post:
      tags:
      - delivery-operations
      summary: Approve a pending rollback request
      operationId: approveRollbackDeliveryOperation
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: rollbackRequestId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/push:
    post:
      tags:
      - delivery
      summary: Push the delivery branch to the configured remote
      operationId: pushDelivery
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/pull-request:
    post:
      tags:
      - delivery
      summary: Create a draft pull request for the delivery
      operationId: pullRequestDelivery
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/promote:
    post:
      tags:
      - delivery
      summary: "Evaluate and apply an ordered, evidence-gated promotion"
      operationId: promoteDelivery
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/evidence:
    post:
      tags:
      - delivery
      summary: Record a Factory delivery evidence fact
      operationId: recordEvidenceDelivery
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/deployment/reconcile:
    post:
      tags:
      - delivery-operations
      summary: Reconcile a running or indeterminate delivery operation
      operationId: reconcileDeliveryOperation
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/deploy:
    post:
      tags:
      - delivery-operations
      summary: Create and execute a deployment operation
      operationId: deployDeliveryOperation
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/delivery/checkpoint:
    post:
      tags:
      - delivery
      summary: Create a git checkpoint commit for the delivery
      operationId: checkpointDelivery
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
  /api/factory/admin/artifacts/{artifactId}/purge:
    post:
      tags:
      - artifact-admin-controller
      operationId: purgeArtifactArtifactAdmin
      parameters:
      - name: artifactId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/factory/admin/artifacts/{artifactId}/legal-hold:
    post:
      tags:
      - artifact-admin-controller
      operationId: setLegalHoldArtifactAdmin
      parameters:
      - name: artifactId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/factory/admin/artifacts/gc:
    post:
      tags:
      - artifact-admin-controller
      operationId: collectAndAuditGarbageArtifactAdmin
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
  /api/factory/workflows/{workflowId}/environment:
    get:
      tags:
      - work-environments
      summary: Get the current environment of a workflow
      operationId: getEnvironmentWorkUnitEnvironment
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnvironmentDataEnvelopeEnvironmentResponse"
  /api/factory/workflows/{workflowId}/delivery:
    get:
      tags:
      - delivery
      summary: Get the current delivery status of a workflow
      operationId: statusDelivery
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryDataEnvelopeObject"
components:
  schemas:
    OracleRunRequest:
      type: object
      properties:
        namespaceId:
          type: string
        idempotencyKey:
          type: string
    DataEnvelopeOracleRunResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/OracleRunResponse"
      required:
      - data
    OracleRunResponse:
      type: object
      properties:
        workflowId:
          type: string
        stepId:
          type: string
        oracleId:
          type: string
        executionId:
          type: string
        status:
          type: string
        revision:
          type: integer
          format: int32
        outcome:
          type: string
        evidenceId:
          type: string
        artifactId:
          type: string
        created:
          type: boolean
        idempotent:
          type: boolean
      required:
      - created
      - executionId
      - idempotent
      - oracleId
      - outcome
      - revision
      - status
      - stepId
      - workflowId
    ReleaseEnvironmentRequest:
      type: object
      properties:
        state:
          type: string
    EnvironmentDataEnvelopeEnvironmentResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/EnvironmentResponse"
      required:
      - data
    EnvironmentResponse:
      type: object
      properties:
        revision:
          type: integer
          format: int32
        environment:
          $ref: "#/components/schemas/WorkEnvironment"
        reconciliation:
          $ref: "#/components/schemas/ReconciliationResponse"
        headCommit:
          type: string
        fileAccess:
          $ref: "#/components/schemas/FileAccessResponse"
      required:
      - environment
      - fileAccess
      - revision
    FileAccessResponse:
      type: object
      properties:
        status:
          type: string
        code:
          type: string
        rootPath:
          type: string
      required:
      - rootPath
      - status
    ReconciliationResponse:
      type: object
      properties:
        status:
          type: string
        headCommit:
          type: string
        baseCommit:
          type: string
      required:
      - status
    WorkEnvironment:
      type: object
      properties:
        organizationId:
          type: string
        workstreamId:
          type: string
        environmentId:
          type: string
        workUnitId:
          type: string
        workflowId:
          type: string
        namespaceId:
          type: string
        parentCaseId:
          type: string
        repoRoot:
          type: string
        integrationBranch:
          type: string
        branch:
          type: string
        worktreePath:
          type: string
        baseCommit:
          type: string
        lifecycleState:
          type: string
          enum:
          - provisioning
          - ready
          - busy
          - decommissioned
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        revision:
          type: integer
          format: int32
        envType:
          type: string
      required:
      - branch
      - createdAt
      - createdBy
      - envType
      - environmentId
      - integrationBranch
      - lifecycleState
      - namespaceId
      - organizationId
      - repoRoot
      - revision
      - workUnitId
      - workflowId
      - workstreamId
      - worktreePath
    ProvisionEnvironmentRequest:
      type: object
      properties:
        workUnitId:
          type: string
        integrationBranch:
          type: string
        branch:
          type: string
        namespaceId:
          type: string
        parentCaseId:
          type: string
        repoRoot:
          type: string
    DeliveryDataEnvelopeObject:
      type: object
      properties:
        data: {}
      required:
      - data
