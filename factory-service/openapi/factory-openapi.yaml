components:
  schemas:
    WorkflowDataEnvelopeObject:
      type: object
      properties:
        data: {}
      required:
      - data
    OracleRunRequest:
      type: object
      properties:
        namespaceId:
          type: string
        idempotencyKey:
          type: string
    DataEnvelopeOracleRunResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/OracleRunResponse"
      required:
      - data
    OracleRunResponse:
      type: object
      properties:
        workflowId:
          type: string
        stepId:
          type: string
        oracleId:
          type: string
        executionId:
          type: string
        status:
          type: string
        revision:
          type: integer
          format: int32
        outcome:
          type: string
        evidenceId:
          type: string
        artifactId:
          type: string
        created:
          type: boolean
        idempotent:
          type: boolean
      required:
      - created
      - executionId
      - idempotent
      - oracleId
      - outcome
      - revision
      - status
      - stepId
      - workflowId
    WorkflowDataEnvelopeMapStringObject:
      type: object
      properties:
        data:
          type: object
          additionalProperties: {}
      required:
      - data
    ReleaseEnvironmentRequest:
      type: object
      properties:
        state:
          type: string
    EnvironmentDataEnvelopeEnvironmentResponse:
      type: object
      properties:
        data:
          $ref: "#/components/schemas/EnvironmentResponse"
      required:
      - data
    EnvironmentResponse:
      type: object
      properties:
        revision:
          type: integer
          format: int32
        environment:
          $ref: "#/components/schemas/WorkEnvironment"
        reconciliation:
          $ref: "#/components/schemas/ReconciliationResponse"
        headCommit:
          type: string
        fileAccess:
          $ref: "#/components/schemas/FileAccessResponse"
      required:
      - environment
      - fileAccess
      - revision
    FileAccessResponse:
      type: object
      properties:
        status:
          type: string
        code:
          type: string
        rootPath:
          type: string
      required:
      - rootPath
      - status
    ReconciliationResponse:
      type: object
      properties:
        status:
          type: string
        headCommit:
          type: string
        baseCommit:
          type: string
      required:
      - status
    WorkEnvironment:
      type: object
      properties:
        organizationId:
          type: string
        workstreamId:
          type: string
        environmentId:
          type: string
        workUnitId:
          type: string
        workflowId:
          type: string
        namespaceId:
          type: string
        parentCaseId:
          type: string
        repoRoot:
          type: string
        integrationBranch:
          type: string
        branch:
          type: string
        worktreePath:
          type: string
        baseCommit:
          type: string
        lifecycleState:
          type: string
          enum:
          - provisioning
          - ready
          - busy
          - decommissioned
        createdBy:
          type: string
        createdAt:
          type: string
          format: date-time
        revision:
          type: integer
          format: int32
        envType:
          type: string
      required:
      - branch
      - createdAt
      - createdBy
      - envType
      - environmentId
      - integrationBranch
      - lifecycleState
      - namespaceId
      - organizationId
      - repoRoot
      - revision
      - workUnitId
      - workflowId
      - workstreamId
      - worktreePath
    ProvisionEnvironmentRequest:
      type: object
      properties:
        workUnitId:
          type: string
        integrationBranch:
          type: string
        branch:
          type: string
        namespaceId:
          type: string
        parentCaseId:
          type: string
        repoRoot:
          type: string
    DeliveryDataEnvelopeObject:
      type: object
      properties:
        data: {}
      required:
      - data
    AgentStepResultRequest:
      type: object
      properties:
        attemptId:
          type: string
        result:
          $ref: "#/components/schemas/JsonNode"
        business:
          $ref: "#/components/schemas/JsonNode"
        observed:
          $ref: "#/components/schemas/ObservedIdentityRequest"
        caseId:
          type: string
        agentName:
          type: string
        idempotencyKey:
          type: string
    JsonNode: {}
    ObservedIdentityRequest:
      type: object
      properties:
        attemptId:
          type: string
        caseId:
          type: string
        agentName:
          type: string
    ErrorDetail:
