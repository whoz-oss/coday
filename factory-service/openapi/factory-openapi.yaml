openapi: 3.1.0
info:
  title: Factory Service API
  description: REST API for the Factory Service — autonomous Kotlin/Spring Boot backend
  version: 0.0.1
servers:
- url: http://localhost:18141
  description: Generated server url
tags:
- name: work-environments
  description: Work-unit environment provisioning control plane
- name: forge
  description: "Forge/BMAD runs, gates and story operations"
- name: workflows
  description: "Workflow projections, transitions and interactions"
- name: agentos-proxy
  description: AgentOS relay endpoints
- name: jira
  description: Jira ticket relay
- name: delivery
  description: Governed delivery control plane
- name: agent-step-results
  description: Capability-bound agent step result submission
- name: runs
  description: Legacy workflow JSONL runs
- name: delivery-operations
  description: "Delivery deployment, verification and rollback control plane"
- name: workflows
  description: Workflow definitions
- name: workstreams
  description: Factory workstreams
- name: oracles
  description: Oracle definitions and execution runs
paths:
  /api/factory/workflows/{workflowId}/projection:
    get:
      tags:
      - workflows
      summary: Read the current workflow projection.
      operationId: projectionWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeMapStringObject"
    put:
      tags:
      - workflows
      summary: Publish a declarative workflow projection.
      operationId: publishProjectionWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
  /api/runs:
    get:
      tags:
      - runs
      summary: List legacy runs.
      operationId: listLegacyRun
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
    post:
      tags:
      - runs
      summary: Launch a legacy run (returns the pid).
      operationId: launchLegacyRun
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/review-gate/reply:
    post:
      tags:
      - runs
      summary: Deprecated global review-gate reply route.
      operationId: deprecatedGateReplyLegacyRun
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/forge/runs/{epicRunId}/stories/{storyRunId}/oracles:
    get:
      tags:
      - forge
      summary: List Story oracle campaigns.
      operationId: oraclesForgeRun
      parameters:
      - name: epicRunId
        in: path
        required: true
        schema:
          type: string
      - name: storyRunId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
    post:
      tags:
      - forge
      summary: Execute the Story oracle campaign (G3).
      operationId: executeOraclesForgeRun
      parameters:
      - name: epicRunId
        in: path
        required: true
        schema:
          type: string
      - name: storyRunId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/forge/runs/{epicRunId}/stories/{storyRunId}/executions:
    get:
      tags:
      - forge
      summary: List Story executions.
      operationId: executionsForgeRun
      parameters:
      - name: epicRunId
        in: path
        required: true
        schema:
          type: string
      - name: storyRunId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
    post:
      tags:
      - forge
      summary: Execute the read-only Story analysis phase.
      operationId: executeAnalysisForgeRun
      parameters:
      - name: epicRunId
        in: path
        required: true
        schema:
          type: string
      - name: storyRunId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/forge/runs/{epicRunId}/stories/{storyRunId}/edits:
    get:
      tags:
      - forge
      summary: List Story edits.
      operationId: editsForgeRun
      parameters:
      - name: epicRunId
        in: path
        required: true
        schema:
          type: string
      - name: storyRunId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
    post:
      tags:
      - forge
      summary: Execute the write-enabled Story edit phase.
      operationId: executeEditForgeRun
      parameters:
      - name: epicRunId
        in: path
        required: true
        schema:
          type: string
      - name: storyRunId
        in: path
        required: true
        schema:
          type: string
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
  /api/factory/workstreams:
    get:
      tags:
      - workstreams
      summary: List workstreams for the caller's tenant.
      operationId: listWorkstream
      parameters:
      - name: namespaceId
        in: query
        required: false
        schema:
          type: string
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: {}
    post:
      tags:
      - workstreams
      summary: Create a workstream entry.
      operationId: createWorkstream
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                type: object
                additionalProperties: {}
  /api/factory/workflows/{workflowId}/transitions:
    post:
      tags:
      - workflows
      summary: Apply a revision-safe workflow transition.
      operationId: transitionWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkflowDataEnvelopeObject"
  /api/factory/workflows/{workflowId}/steps/{stepId}/oracles/{oracleId}/runs:
    post:
      tags:
      - oracles
      summary: Run an oracle against a workflow step
      description: Starts (or idempotently replays) one oracle execution for the given
        step.
      operationId: runOracle
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      - name: stepId
        in: path
        required: true
        schema:
          type: string
      - name: oracleId
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OracleRunRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataEnvelopeOracleRunResponse"
  /api/factory/workflows/{workflowId}/start:
    post:
      tags:
      - workflows
      summary: Start a governed workflow instance from a definition.
      operationId: startWorkflow
      parameters:
      - name: workflowId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: {}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
