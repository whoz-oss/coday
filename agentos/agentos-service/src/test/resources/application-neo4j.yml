# Activates the standalone Neo4j persistence mode in tests.
# Combined with the 'test' profile (application-test.yml sets mode=embedded-neo4j),
# this profile overrides the mode to neo4j so that EmbeddedNeo4jConfiguration stays off
# and the Driver comes from the Testcontainers container instead.
# The actual URI is injected at runtime via @DynamicPropertySource from the
# Testcontainers container in each test class.
agentos:
  persistence:
    mode: neo4j

spring:
  data:
    neo4j:
      repositories:
        enabled: true
