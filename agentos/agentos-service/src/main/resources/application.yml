spring:
  application:
    name: agentos
  jackson:
    mapper:
      sort-properties-alphabetically: true
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      # Global upload limits (file-exchange uploads + plugin jars), raised from Spring's 1MB
      # default. Overridable via env (relaxed binding), like the other params.
      max-file-size: ${AGENTOS_MULTIPART_MAX_FILE_SIZE:25MB}
      max-request-size: ${AGENTOS_MULTIPART_MAX_REQUEST_SIZE:30MB}
  cloud:
    # Spring Cloud 2024.0.x (Moore) targets Spring Boot 3.4.x officially.
    # AgentOS runs Spring Boot 3.5.x which is functionally compatible but
    # triggers the built-in version guard. Disable the guard globally so the
    # service starts cleanly in all profiles (standalone, whoz, test).
    compatibility-verifier:
      enabled: false
    config:
      # Disable Cloud Config by default. Enabled only with the 'whoz' profile.
      enabled: false
    discovery:
      # Disable service discovery (Eureka) by default. Enabled only with the
      # 'whoz' profile. Without this, EurekaClientAutoConfiguration fires and
      # requires TransportClientFactories even in standalone mode.
      enabled: false
  ai:
    chat:
      client:
        enabled: false
      observations:
        include-error-logging: true
    tools:
      observations:
        include-content: false
    model:
      chat: none
      audio:
        speech: none
        transcription: none
      image: none
      embedding: none
      moderation: none
    openai:
      api-key: ${OPENAI_API_KEY:}
      chat:
        options:
          model: gpt-4-turbo-preview
          temperature: 0.7
    
    anthropic:
      api-key: ${ANTHROPIC_API_KEY:}
      chat:
        options:
          model: claude-3-5-sonnet-20241022
          temperature: 0.7
    
    ollama:
      init:
        # Prevent the Ollama starter from pulling models at startup.
        # Model creation is managed exclusively by ChatModelFactory.
        pull-model-strategy: never
    mcp:
      client:
        enabled: ${MCP_ENABLED:false}

server:
  port: 8124
  compression:
    enabled: false
  error:
    include-message: always
    include-binding-errors: always

management:
  endpoints:
    web:
      # Use /management as base path to follow Whoz backend conventions.
      # Eureka health check URL is configured accordingly in application-whoz.yml.
      base-path: /management
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      # 'always' so that Eureka can read the health status without credentials.
      # The health endpoint itself does not expose sensitive data.
      show-details: always
# cmd line to run datadog container
# docker run -d \
# -e DD_API_KEY=xxxxxx \
# -e DD_SITE=datadoghq.eu \
# -e DD_HOSTNAME=thomas.martin \
# -e DD_DOGSTATSD_NON_LOCAL_TRAFFIC=true \
# -p 8126:8126 -p 8127:8125/udp \
# datadog/agent:latest

agentos:
  case:
    # Grace period (ms) before an idle runtime with no SSE subscribers is evicted.
    # Override with env var: AGENTOS_CASE_IDLE_EVICTION_GRACE_MS
    # idle-eviction-grace-ms: 300000
    # Interval (ms) between SSE keep-alive comment frames sent to connected clients.
    # Override with env var: AGENTOS_CASE_SSE_HEARTBEAT_INTERVAL_MS
    # sse-heartbeat-interval-ms: 30000
  exchange:
    # Root directory for file-exchange files (relative to the working directory).
    # Override with env var: AGENTOS_EXCHANGE_MOUNT_ROOT
    # mount-root: data/exchange/
    # Comma-separated file extensions allowed for user uploads (lowercase, no dot). The default
    # covers text/doc/data/image/code; empty allows any. Expected to differ per AgentOS instance.
    # Override with env var: AGENTOS_EXCHANGE_ALLOWED_UPLOAD_EXTENSIONS
    # allowed-upload-extensions: txt,md,pdf,png,csv,json
    # Max size (bytes) the read/download endpoints load into memory. Also caps the agent read tools
    # on the same directories, converted to whole megabytes with a floor of 1 MB.
    # Override with env var: AGENTOS_EXCHANGE_READ_MAX_SIZE_BYTES
    # read-max-size-bytes: 104857600
    # File tools granted to agents on the case / namespace exchange. One set of values is shared by
    # both scopes; rootPath and readOnly are computed per run, and readMaxSizeMb derives from
    # read-max-size-bytes above.
    tools:
      # Grant the case exchange to every agent that does not mention CASE_FILE_EXCHANGE in its
      # integrations map. An agent that lists the key decides for itself; an empty list opts out.
      # Override with env var: AGENTOS_EXCHANGE_TOOLS_CASE_ENABLED_BY_DEFAULT
      # case-enabled-by-default: false
      # Same platform default for NAMESPACE_FILE_EXCHANGE. Every namespace grant, default or
      # declared, also requires the invoking user to hold Namespace READ; a run without an
      # identified user is denied. Write access follows the user's Namespace WRITE right.
      # Override with env var: AGENTOS_EXCHANGE_TOOLS_NAMESPACE_ENABLED_BY_DEFAULT
      # namespace-enabled-by-default: false
      # Comma-separated extra patterns blocked for the agent file tools, on top of the plugin's
      # built-in sensitive-file list (.env, *.key, *.pem). Additive only, built-ins always apply.
      # A pattern matches the file or directory NAME only, never the path: *suffix, prefix*,
      # *contains* or an exact name. A path-shaped pattern like "secrets/*" matches nothing, and a
      # prefix pattern denies a matching directory entry without denying the files inside it.
      # Override with env var: AGENTOS_EXCHANGE_TOOLS_EXTRA_DENY_PATTERNS
      # extra-deny-patterns: "*.bak,*confidential*"
      # Longest edge (px) of the images readAsImage/readDocument hand to the LLM; larger ones are
      # downscaled. Track the vision model in use.
      # Override with env var: AGENTOS_EXCHANGE_TOOLS_IMAGE_MAX_DIMENSION
      # image-max-dimension: 1024
      # JPEG re-encoding quality between 0 and 1: prompt bytes against the legibility of screenshots
      # and scans. Out-of-range values are clamped.
      # Override with env var: AGENTOS_EXCHANGE_TOOLS_IMAGE_JPEG_QUALITY
      # image-jpeg-quality: 0.80
      # Decode-bomb guard: a source or embedded image above this pixel count is refused before being
      # decoded. Raise it only if the heap can absorb the larger raster.
      # Override with env var: AGENTOS_EXCHANGE_TOOLS_IMAGE_MAX_SOURCE_PIXELS
      # image-max-source-pixels: 50000000
      # Originals at or below this byte size that already fit the max dimension are forwarded
      # untouched instead of re-encoded, preserving text sharpness.
      # Override with env var: AGENTOS_EXCHANGE_TOOLS_IMAGE_PASS_THROUGH_MAX_BYTES
      # image-pass-through-max-bytes: 1048576
      # Markdown character budget of one readDocument call; a longer document is paged via
      # startElement. Scales with the context window of the models this instance runs.
      # Override with env var: AGENTOS_EXCHANGE_TOOLS_DOCUMENT_MAX_OUTPUT_CHARS
      # document-max-output-chars: 100000
      # Maximum embedded pictures readDocument attaches per call — the image half of that budget.
      # Override with env var: AGENTOS_EXCHANGE_TOOLS_DOCUMENT_MAX_ATTACHED_IMAGES
      # document-max-attached-images: 10
      # Table columns beyond this are dropped when readDocument renders a .docx table to Markdown.
      # Override with env var: AGENTOS_EXCHANGE_TOOLS_DOCUMENT_MAX_TABLE_COLUMNS
      # document-max-table-columns: 64
      # A single table cell longer than this is truncated by readDocument.
      # Override with env var: AGENTOS_EXCHANGE_TOOLS_DOCUMENT_MAX_CELL_CHARS
      # document-max-cell-chars: 5000
  defaults:
  # Environment-level fallback agent name. Consulted when a namespace has no
  # defaultAgentName configured. The named agent must exist in the case's namespace.
  # Override with env var: AGENTOS_DEFAULTS_AGENT_NAME
  # agent-name: copilot
  # Char-equivalent cost of one tool-response image against the agent's detailed-context budget.
  # Override with env var: AGENTOS_DEFAULTS_IMAGE_CHAR_COST
  # image-char-cost: 6000
  # Maximum tool-response images attached as Media across a whole prompt (newest first).
  # Override with env var: AGENTOS_DEFAULTS_MAX_ATTACHED_IMAGES
  # max-attached-images: 20
  plugins:
    dir: ${PLUGINS_DIR:plugins/}
  security:
    # Identity resolution mode: 'local' (default) or 'auth'.
    # local: uses the OS username; auto-creates a User record on first access.
    # auth:  decodes the Cloudflare JWT (CF_Authorization header) or falls back
    #        to x-forwarded-email; requires the User to be pre-registered.
    # Override with env var: AGENTOS_SECURITY_MODE
    mode: local
  bootstrap:
    # Enable bootstrap service to run on startup
    # Override with env var: AGENTOS_BOOTSTRAP_ENABLED
    enabled: true
    # External identifier of the auto-created admin when the database is empty.
    # If unset, falls back to the JVM user.name system property — which matches
    # the OS user in 'local' mode and lets the bootstrap admin be immediately
    # usable on first request without further configuration.
    # In 'auth' mode, set this to the email expected from JWT claims.
    # Override with env var: AGENTOS_BOOTSTRAP_ADMIN_EXTERNAL_ID
    # admin-external-id: admin
  persistence:
    # Root directory for persisted JSON files. Relative to the working directory.
    # Override with env var: AGENTOS_PERSISTENCE_DATA_DIR
    data-dir: data/
    # Persistence mode:
    #   embedded-neo4j (default) - embedded Neo4j engine, no Docker required;
    #                              database stored under data-dir/neo4j/
    #   neo4j                    - standalone Neo4j server (requires spring.neo4j.* config)
    # Override with env var: AGENTOS_PERSISTENCE_MODE
    mode: ${AGENTOS_PERSISTENCE_MODE:embedded-neo4j}

scheduler:
  # Enable/disable the scheduler. Enabled by default for production.
  # Dev profiles (embedded-neo4j, docker) disable it to prevent accidental Case creation.
  # Override with env var: SCHEDULER_ENABLED
  enabled: ${SCHEDULER_ENABLED:true}
  # Interval between claim ticks in milliseconds.
  # Override with env var: SCHEDULER_TICK_INTERVAL_MS
  tick-interval-ms: ${SCHEDULER_TICK_INTERVAL_MS:30000}

springdoc:
  writer-with-order-by-keys: true

logging:
  level:
    root: INFO
    io.whozoss.agentos.service: DEBUG
    org.pf4j: DEBUG
    org.springframework.ai: DEBUG
    # Neo4j driver emits ClientNotification warnings (e.g. UnknownPropertyKeyWarning,
    # UnknownRelationshipTypeWarning) for optional node properties or relationship types
    # that are absent on some nodes. These are harmless — SDN queries all declared fields
    # regardless of whether every node has them, and BELONGS_TO edges are absent until the
    # first entity of each type is written — but they flood the logs on a fresh database.
    # SDN routes these notifications through org.springframework.data.neo4j.cypher.*
    # (ResultSummaries.logNotifications guards on cypherLog.isWarnEnabled). Setting the
    # parent logger to ERROR suppresses all notification categories at once.
    org.neo4j.driver: ERROR
    org.springframework.data.neo4j.cypher: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
