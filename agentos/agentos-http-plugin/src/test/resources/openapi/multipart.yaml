openapi: 3.0.0
info:
  title: Multipart
  version: 1.0.0
paths:
  /upload:
    post:
      operationId: uploadFile
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '201':
          description: Uploaded
  /ping:
    get:
      operationId: ping
      responses:
        '200':
          description: pong
