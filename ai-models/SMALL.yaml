# Model tier shared by every checkout. Requires an AI provider named `requesty` in the
# namespace (or at platform level) holding your own Requesty key; without it this model is
# ignored. Existing limits and USD-per-million-token prices are retained estimates;
# the policy's backing model, limits and actual rates may change in Requesty.
# Configure policies claude-haiku, claude-sonnet and claude-opus in your Requesty account before use.
alias: SMALL
apiModelName: policy/claude-haiku
provider: requesty
description: Claude Haiku tier via your Requesty policy; backing model may change
priority: 10
contextWindow: 200000
pricing:
  inputMTokens: 1
  outputMTokens: 5
  cacheRead: 0.1
  cacheWrite: 1.25
